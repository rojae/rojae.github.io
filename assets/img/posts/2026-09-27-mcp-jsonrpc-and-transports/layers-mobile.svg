<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1167" viewBox="0 0 320 1167" role="img" aria-labelledby="mcp-layers-mobile-title mcp-layers-mobile-desc"><title id="mcp-layers-mobile-title">MCP는 두 층입니다: 고정된 메시지 층과 고를 수 있는 통로 층</title><desc id="mcp-layers-mobile-desc">위는 메시지 층입니다. JSON-RPC 2.0 봉투와 initialize, tools/list, tools/call 같은 MCP 메서드로 고정돼 있습니다. 같은 JSON 한 줄이 아래 통로 층의 세 통로로 내려갑니다. stdio는 stdin으로 요청, stdout으로 응답을 한 줄씩 주고받고 프로세스 하나가 세션이며 죽으면 EOF와 BrokenPipe만 남습니다. Streamable HTTP는 POST /mcp 하나로 요청하고 같은 POST의 응답으로 JSON 또는 SSE 형식을 받으며 Mcp-Session-Id 헤더로 세션을 잇고 DELETE로 세션을 끝내며, 서버가 죽으면 연결이 거부되고 재기동 뒤에는 404 Session not found가 옵니다. 레거시 SSE 전송은 이 글의 실험 3 경로 기준으로 POST /mcp/message?sessionId로 요청하고 GET /sse로 열어 둔 스트림으로 응답을 받으며, 2025-03-26 스펙에서 Streamable HTTP로 대체돼 점선으로 표시했습니다.</desc><defs><marker id="mcp-layers-mobile-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="mcp-layers-mobile-arrow-sub" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#52677c" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="12" y="30" font-size="18" style="fill:#285fbc" font-weight="700" text-anchor="start"><tspan>① 메시지 층 · 고정</tspan></text><rect x="12" y="44" width="296" height="196" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="26" y="74" font-size="19" style="fill:#192e42" font-weight="700" text-anchor="start"><tspan>JSON-RPC 2.0 봉투</tspan></text><text x="26" y="98" font-size="17" style="fill:#192e42" font-weight="600" text-anchor="start"><tspan>+ MCP 메서드</tspan></text><rect x="26" y="110" width="116" height="32" rx="5" fill="#fff" stroke="#285fbc" stroke-width="1.2"/><text x="84" y="132" font-size="17" style="fill:#285fbc" font-weight="600" text-anchor="middle"><tspan class="mono">initialize</tspan></text><rect x="150" y="110" width="116" height="32" rx="5" fill="#fff" stroke="#285fbc" stroke-width="1.2"/><text x="208" y="132" font-size="17" style="fill:#285fbc" font-weight="600" text-anchor="middle"><tspan class="mono">tools/list</tspan></text><rect x="26" y="148" width="116" height="32" rx="5" fill="#fff" stroke="#285fbc" stroke-width="1.2"/><text x="84" y="170" font-size="17" style="fill:#285fbc" font-weight="600" text-anchor="middle"><tspan class="mono">tools/call</tspan></text><text x="150" y="170" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>통로와 무관</tspan></text><rect x="26" y="190" width="268" height="40" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.2"/><text x="36" y="207" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start"><tspan class="mono">{"jsonrpc":"2.0","id":2,</tspan></text><text x="36" y="225" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start"><tspan class="mono">"method":"tools/list"}</tspan></text><text x="40" y="268" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>같은 JSON 한 줄이 내려감</tspan></text><text x="12" y="304" font-size="18" style="fill:#285fbc" font-weight="700" text-anchor="start"><tspan>② 통로 층 · 선택</tspan></text><rect x="48" y="320" width="260" height="204" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="62" y="349" font-size="19" style="fill:#192e42" font-weight="700" text-anchor="start"><tspan>stdio</tspan></text><text x="62" y="372" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>처음부터 있던 통로</tspan></text><path d="M62 382H294" stroke="#cdd8e3" stroke-width="1.2"/><text x="62" y="406" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>요청</tspan></text><text x="120" y="406" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">stdin</tspan><tspan> ↓ 한 줄</tspan></text><text x="62" y="439" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>응답</tspan></text><text x="120" y="439" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">stdout</tspan><tspan> ↑ 한 줄</tspan></text><text x="62" y="472" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>세션</tspan></text><text x="120" y="472" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>프로세스 = 세션</tspan></text><text x="62" y="505" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>죽으면</tspan></text><text x="120" y="505" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">EOF · BrokenPipe</tspan></text><rect x="48" y="542" width="260" height="304" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="62" y="571" font-size="19" style="fill:#192e42" font-weight="700" text-anchor="start"><tspan>Streamable HTTP</tspan></text><text x="62" y="594" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>2025-03-26 스펙</tspan></text><path d="M62 604H294" stroke="#cdd8e3" stroke-width="1.2"/><text x="62" y="628" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>요청</tspan></text><text x="120" y="628" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">POST /mcp</tspan></text><text x="62" y="661" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>응답</tspan></text><text x="120" y="661" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>같은 POST의 응답</tspan></text><text x="120" y="686" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>JSON 또는 SSE 형식</tspan></text><text x="62" y="719" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>세션</tspan></text><text x="120" y="719" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">Mcp-Session-Id</tspan><tspan> 헤더</tspan></text><text x="120" y="744" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>종료: </tspan><tspan class="mono">DELETE</tspan></text><text x="62" y="777" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>죽으면</tspan></text><text x="120" y="777" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>연결 거부,</tspan></text><text x="120" y="802" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan>재기동 뒤 404</tspan></text><text x="120" y="827" font-size="17" style="fill:#192e42" font-weight="550" text-anchor="start"><tspan class="mono">Session not found</tspan></text><rect x="48" y="864" width="260" height="229" rx="6" fill="#fff" stroke="#52677c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="62" y="893" font-size="19" style="fill:#52677c" font-weight="700" text-anchor="start"><tspan>레거시 SSE</tspan></text><text x="62" y="916" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>2025-03-26에 대체됨</tspan></text><path d="M62 926H294" stroke="#cdd8e3" stroke-width="1.2"/><text x="62" y="950" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>요청</tspan></text><text x="120" y="950" font-size="17" style="fill:#52677c" font-weight="550" text-anchor="start"><tspan class="mono">POST /mcp/message</tspan></text><text x="120" y="975" font-size="17" style="fill:#52677c" font-weight="550" text-anchor="start"><tspan class="mono">?sessionId=…</tspan></text><text x="62" y="1008" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>응답</tspan></text><text x="120" y="1008" font-size="17" style="fill:#52677c" font-weight="550" text-anchor="start"><tspan class="mono">GET /sse</tspan><tspan> 스트림</tspan></text><text x="62" y="1041" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>세션</tspan></text><text x="120" y="1041" font-size="17" style="fill:#52677c" font-weight="550" text-anchor="start"><tspan>URL의 </tspan><tspan class="mono">sessionId</tspan></text><text x="62" y="1074" font-size="17" style="fill:#52677c" font-weight="600" text-anchor="start"><tspan>죽으면</tspan></text><text x="120" y="1074" font-size="17" style="fill:#52677c" font-weight="550" text-anchor="start"><tspan>스트림이 끊김</tspan></text><path d="M26 240V566" fill="none" stroke="#285fbc" stroke-width="1.8"/><path d="M26 344H46" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#mcp-layers-mobile-arrow)"/><path d="M26 566H46" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#mcp-layers-mobile-arrow)"/><path d="M26 566V888H46" fill="none" stroke="#52677c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#mcp-layers-mobile-arrow-sub)"/><path d="M12 1116H44" stroke="#285fbc" stroke-width="1.8"/><text x="52" y="1121" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>현재 통로</tspan></text><path d="M12 1144H44" stroke="#52677c" stroke-width="1.8" stroke-dasharray="6 5"/><text x="52" y="1149" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start"><tspan>대체된 레거시 통로</tspan></text></svg>