<svg xmlns="http://www.w3.org/2000/svg" width="320" height="930" viewBox="0 0 320 930" role="img" aria-labelledby="t d"><title id="t">분당 밴드가 거절한 요청 뒤에 남는 상태: v0.3.7과 LTS</title><desc id="d">설명용 상황이며 실측이 아닙니다. 초당 밴드 잔여 N, 분당 밴드 잔여 0인 규칙에 요청 하나가 들어옵니다. 공개 v0.3.7은 밴드가 초당, 분당 순서로 설정됐을 때 초당 밴드를 N에서 N-1로 차감한 뒤 분당 밴드에서 거절되어, 초당 N-1이 남은 채 요청이 거절됩니다. LTS d2b771a는 한 Lua 실행에서 Pass 1로 두 밴드를 토큰 차감 없이 모두 검사하고 거절이 있으면 차감하지 않으며, 모두 통과할 때만 Pass 2에서 함께 차감합니다. 이번 예에서는 초당 N, 분당 0이 그대로 남고 요청은 거절됩니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#52677c" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}.sub{fill:#52677c}.blue{fill:#285fbc}.ok{fill:#157458}.bad{fill:#b33c42}.warn{fill:#96501c}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="34" font-size="19" font-weight="750">같은 입력</text><text x="16" y="60" font-size="17" font-weight="500">요청 1건, 초당 잔여 N · 분당 잔여 0</text><text x="16" y="84" font-size="17" font-weight="500" class="sub">설명용 상황, 실측 아님</text><path d="M16 100H304" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="16" y="134" font-size="20" font-weight="750">공개 v0.3.7</text><text x="16" y="160" font-size="17" font-weight="500" class="sub">Java에서 밴드를 설정 순서대로 소비</text><text x="16" y="184" font-size="17" font-weight="500" class="sub">(초당 → 분당 순서일 때)</text>
<rect x="16" y="198" width="288" height="44" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="30" y="226" font-size="17" font-weight="700">① 초당 밴드</text><text x="290" y="226" font-size="17" font-weight="650" text-anchor="end" class="warn">N → N-1 차감</text>
<path d="M160 242V264" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="270" width="288" height="44" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="30" y="298" font-size="17" font-weight="700">② 분당 밴드</text><text x="290" y="298" font-size="17" font-weight="650" text-anchor="end" class="bad">잔여 0 · × 거절</text>
<path d="M160 314V336" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="342" width="288" height="84" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="30" y="366" font-size="17" font-weight="600" class="sub">남는 상태</text><text x="30" y="392" font-size="18" font-weight="750" class="bad">초당 N-1 (차감 잔존)</text><text x="30" y="416" font-size="17" font-weight="600">분당 0 · 요청 거절</text>
<path d="M16 450H304" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="16" y="484" font-size="20" font-weight="750">LTS <tspan class="mono" font-size="18">d2b771a</tspan></text><text x="16" y="510" font-size="17" font-weight="500" class="sub">한 규칙의 밴드를</text><text x="16" y="534" font-size="17" font-weight="500" class="sub">Lua 1회에서 처리</text>
<rect x="8" y="550" width="304" height="256" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="22" y="574" font-size="17" font-weight="650" class="blue">한 Lua 실행 범위</text>
<rect x="22" y="588" width="260" height="64" rx="5" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="152" y="614" font-size="17" font-weight="700" text-anchor="middle">Pass 1 · 차감 없음</text><text x="152" y="640" font-size="17" font-weight="600" text-anchor="middle">초당·분당 모두 검사</text>
<path d="M152 652V680" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="166" y="672" font-size="17" font-weight="650" class="warn">이번 예</text>
<rect x="22" y="686" width="260" height="44" rx="5" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="152" y="714" font-size="17" font-weight="700" text-anchor="middle">거절 있음 → 차감 없음</text>
<path d="M282 620H298V766H288" fill="none" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)"/>
<rect x="22" y="742" width="260" height="52" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="152" y="764" font-size="17" font-weight="600" text-anchor="middle" class="sub">모두 통과 → Pass 2 함께 차감</text><text x="152" y="787" font-size="17" font-weight="500" text-anchor="middle" class="sub">(이번 예 아님)</text>
<path d="M152 806V828" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="834" width="288" height="84" rx="5" fill="#e4f2eb" stroke="#157458" stroke-width="1.5"/><text x="30" y="858" font-size="17" font-weight="600" class="sub">남는 상태 (이번 예)</text><text x="30" y="884" font-size="18" font-weight="750" class="ok">초당 N · 분당 0 그대로</text><text x="30" y="908" font-size="17" font-weight="600">요청 거절</text>
</svg>
