<svg xmlns="http://www.w3.org/2000/svg" width="320" height="900" viewBox="0 0 320 900" role="img" aria-labelledby="t d"><title id="t">같은 입력에서 남는 상태: 명령을 따로 보낼 때와 Lua 한 실행 범위</title><desc id="d">설명용 상황이며 실측이 아닙니다. 잔여 토큰 1에 요청 A와 B가 동시에 들어옵니다. 명령을 따로 보내면 A 조회(잔여 1), B 조회(잔여 1), A 차감, B 차감 순서로 끼어들어 두 요청이 모두 통과하고 잔여는 저장 방식에 따라 0 또는 -1이 됩니다. Lua 한 실행 범위에서는 A의 조회·판단·차감이 한 실행 안에서 끝난 뒤 B가 잔여 0을 조회해 거절되므로 통과 1건, 잔여 0이 남습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#52677c" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}.sub{fill:#52677c}.blue{fill:#285fbc}.ok{fill:#157458}.bad{fill:#b33c42}.warn{fill:#96501c}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="34" font-size="19" font-weight="750">같은 입력</text><text x="16" y="60" font-size="17" font-weight="500">잔여 토큰 1, 요청 A·B 동시 도착</text><text x="16" y="84" font-size="17" font-weight="500" class="sub">설명용 상황, 실측 아님</text><path d="M16 100H304" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="16" y="134" font-size="20" font-weight="750">명령을 따로 보낼 때</text><text x="16" y="160" font-size="17" font-weight="500" class="sub">조회와 차감이 별도 명령</text>
<rect x="16" y="175" width="288" height="38" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="36" cy="194" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="36" y="200" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="58" y="200" font-size="17" font-weight="600">조회</text><text x="292" y="200" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 1</text>
<rect x="16" y="219" width="288" height="38" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="36" cy="238" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="36" y="244" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="58" y="244" font-size="17" font-weight="600">조회</text><text x="292" y="244" font-size="17" font-weight="650" text-anchor="end" class="warn">잔여 1 (A 차감 전)</text>
<rect x="16" y="263" width="288" height="38" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="36" cy="282" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="36" y="288" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="58" y="288" font-size="17" font-weight="600">판단·차감</text><text x="292" y="288" font-size="17" font-weight="650" text-anchor="end" class="ink">통과</text>
<rect x="16" y="307" width="288" height="38" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="36" cy="326" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="36" y="332" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="58" y="332" font-size="17" font-weight="600">판단·차감</text><text x="292" y="332" font-size="17" font-weight="650" text-anchor="end" class="warn">통과</text>
<rect x="16" y="358" width="288" height="72" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="30" y="382" font-size="17" font-weight="600" class="sub">남는 상태 (잔여는 저장 방식별)</text><text x="30" y="413" font-size="18" font-weight="750" class="bad">통과 2건 · 잔여 0 또는 -1</text>
<text x="16" y="456" font-size="17" font-weight="500" class="sub">위에서 아래로 시간 순서</text><path d="M16 476H304" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="16" y="510" font-size="20" font-weight="750">Lua 한 실행 범위</text><text x="16" y="536" font-size="17" font-weight="500" class="sub">조회·판단·차감을 한 번에 실행</text>
<rect x="16" y="552" width="288" height="146" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="30" y="576" font-size="17" font-weight="650" class="blue">A의 Lua 실행 1회</text>
<rect x="28" y="588" width="264" height="32" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="604" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="48" y="610" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="70" y="610" font-size="17" font-weight="600">조회</text><text x="280" y="610" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 1</text>
<rect x="28" y="624" width="264" height="32" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="640" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="48" y="646" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="70" y="646" font-size="17" font-weight="600">판단</text><text x="280" y="646" font-size="17" font-weight="650" text-anchor="end" class="ink">통과</text>
<rect x="28" y="660" width="264" height="32" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="676" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="48" y="682" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="70" y="682" font-size="17" font-weight="600">차감</text><text x="280" y="682" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 0</text>
<rect x="16" y="712" width="288" height="78" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="30" y="736" font-size="17" font-weight="650" class="blue">B의 Lua 실행 (A가 끝난 뒤)</text>
<rect x="28" y="748" width="264" height="32" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="764" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="48" y="770" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="70" y="770" font-size="17" font-weight="600">조회·판단</text><text x="280" y="770" font-size="17" font-weight="650" text-anchor="end" class="warn">잔여 0 → 거절</text>
<rect x="16" y="806" width="288" height="72" rx="5" fill="#e4f2eb" stroke="#157458" stroke-width="1.5"/><text x="30" y="830" font-size="17" font-weight="600" class="sub">남는 상태</text><text x="30" y="861" font-size="18" font-weight="750" class="ok">통과 1건 · 잔여 0</text>
</svg>
