<svg xmlns="http://www.w3.org/2000/svg" width="700" height="498" viewBox="0 0 700 498" role="img" aria-labelledby="t d"><title id="t">분당 밴드가 거절한 요청 뒤에 남는 상태: v0.3.7과 LTS</title><desc id="d">설명용 상황이며 실측이 아닙니다. 초당 밴드 잔여 N, 분당 밴드 잔여 0인 규칙에 요청 하나가 들어옵니다. 공개 v0.3.7은 밴드가 초당, 분당 순서로 설정됐을 때 초당 밴드를 N에서 N-1로 차감한 뒤 분당 밴드에서 거절되어, 초당 N-1이 남은 채 요청이 거절됩니다. LTS 예정 (1.0.0)은 한 Lua 실행에서 Pass 1로 두 밴드를 토큰 차감 없이 모두 검사하고 거절이 있으면 차감하지 않으며, 모두 통과할 때만 Pass 2에서 함께 차감합니다. 이번 예에서는 초당 N, 분당 0이 그대로 남고 요청은 거절됩니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#52677c" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}.sub{fill:#52677c}.blue{fill:#285fbc}.ok{fill:#157458}.bad{fill:#b33c42}.warn{fill:#96501c}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="28" y="36" font-size="18" font-weight="700">같은 입력 · 요청 1건, 초당 잔여 N · 분당 잔여 0</text><text x="672" y="36" font-size="16" font-weight="500" text-anchor="end" class="sub">설명용 상황, 실측 아님</text><path d="M28 54H672" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="28" y="88" font-size="19" font-weight="750">공개 v0.3.7</text><text x="28" y="112" font-size="16" font-weight="500" class="sub">Java에서 밴드를 설정 순서대로 소비 (초당 → 분당 순서일 때)</text>
<rect x="28" y="128" width="160" height="80" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="108" y="160" font-size="17" font-weight="700" text-anchor="middle">① 초당 밴드</text><text x="108" y="188" font-size="17" font-weight="650" text-anchor="middle" class="warn">N → N-1 차감</text>
<path d="M188 168H218" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="224" y="128" width="160" height="80" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="304" y="160" font-size="17" font-weight="700" text-anchor="middle">② 분당 밴드</text><text x="304" y="188" font-size="17" font-weight="650" text-anchor="middle" class="bad">잔여 0 · × 거절</text>
<path d="M384 168H414" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="128" width="252" height="80" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="436" y="150" font-size="16" font-weight="600" class="sub">남는 상태</text><text x="436" y="175" font-size="17" font-weight="750" class="bad">초당 N-1 (차감 잔존)</text><text x="436" y="198" font-size="17" font-weight="600">분당 0 · 요청 거절</text>
<path d="M28 236H672" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="28" y="270" font-size="19" font-weight="750">LTS 예정 (1.0.0)</text><text x="28" y="294" font-size="16" font-weight="500" class="sub">한 규칙의 밴드를 Lua 1회에서 처리</text>
<rect x="28" y="310" width="436" height="164" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="42" y="333" font-size="16" font-weight="650" class="blue">한 Lua 실행 범위</text>
<rect x="42" y="346" width="150" height="112" rx="5" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="117" y="374" font-size="17" font-weight="700" text-anchor="middle">Pass 1</text><text x="117" y="400" font-size="17" font-weight="600" text-anchor="middle">초당·분당 검사</text><text x="117" y="426" font-size="16" font-weight="500" text-anchor="middle" class="sub">차감 없음</text>
<path d="M192 402H208V370H222" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M208 402V432H222" fill="none" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)"/>
<text x="450" y="342" font-size="16" font-weight="650" text-anchor="end" class="warn">이번 예</text><rect x="228" y="348" width="222" height="44" rx="5" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="339" y="376" font-size="16" font-weight="700" text-anchor="middle">거절 있음 → 차감 없음</text>
<rect x="228" y="404" width="222" height="56" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="339" y="426" font-size="16" font-weight="600" text-anchor="middle" class="sub">모두 통과 → Pass 2 함께 차감</text><text x="339" y="450" font-size="16" font-weight="500" text-anchor="middle" class="sub">(이번 예 아님)</text>
<path d="M450 370H474" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480" y="322" width="192" height="96" rx="5" fill="#e4f2eb" stroke="#157458" stroke-width="1.5"/><text x="494" y="346" font-size="16" font-weight="600" class="sub">남는 상태 (이번 예)</text><text x="494" y="373" font-size="17" font-weight="750" class="ok">초당 N · 분당 0</text><text x="494" y="398" font-size="17" font-weight="600">그대로 · 요청 거절</text>
</svg>
