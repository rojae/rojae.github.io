<svg xmlns="http://www.w3.org/2000/svg" width="700" height="492" viewBox="0 0 700 492" role="img" aria-labelledby="t d"><title id="t">같은 입력에서 남는 상태: 명령을 따로 보낼 때와 Lua 한 실행 범위</title><desc id="d">설명용 상황이며 실측이 아닙니다. 잔여 토큰 1에 요청 A와 B가 동시에 들어옵니다. 명령을 따로 보내면 A 조회(잔여 1), B 조회(잔여 1), A 차감, B 차감 순서로 끼어들어 두 요청이 모두 통과하고 잔여는 저장 방식에 따라 0 또는 -1이 됩니다. Lua 한 실행 범위에서는 A의 조회·판단·차감이 한 실행 안에서 끝난 뒤 B가 잔여 0을 조회해 거절되므로 통과 1건, 잔여 0이 남습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#52677c" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}.sub{fill:#52677c}.blue{fill:#285fbc}.ok{fill:#157458}.bad{fill:#b33c42}.warn{fill:#96501c}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="28" y="36" font-size="18" font-weight="700">같은 입력 · 잔여 토큰 1, 요청 A·B 동시 도착</text><text x="672" y="36" font-size="16" font-weight="500" text-anchor="end" class="sub">설명용 상황, 실측 아님</text><path d="M28 54H672" stroke="#cdd8e3" stroke-width="1.5"/><path d="M350 72V446" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="28" y="88" font-size="19" font-weight="750">명령을 따로 보낼 때</text><text x="28" y="112" font-size="16" font-weight="500" class="sub">조회와 차감이 별도 명령</text>
<rect x="28" y="132" width="306" height="36" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="150" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="48" y="156" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="70" y="156" font-size="17" font-weight="600">조회</text><text x="322" y="156" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 1</text>
<rect x="28" y="178" width="306" height="36" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="196" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="48" y="202" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="70" y="202" font-size="17" font-weight="600">조회</text><text x="322" y="202" font-size="17" font-weight="650" text-anchor="end" class="warn">잔여 1 (A 차감 전)</text>
<rect x="28" y="224" width="306" height="36" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="242" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="48" y="248" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="70" y="248" font-size="17" font-weight="600">판단·차감</text><text x="322" y="248" font-size="17" font-weight="650" text-anchor="end" class="ink">통과</text>
<rect x="28" y="270" width="306" height="36" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="48" cy="288" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="48" y="294" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="70" y="294" font-size="17" font-weight="600">판단·차감</text><text x="322" y="294" font-size="17" font-weight="650" text-anchor="end" class="warn">통과</text>
<rect x="28" y="376" width="306" height="70" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="44" y="400" font-size="16" font-weight="600" class="sub">남는 상태 (잔여는 저장 방식별)</text><text x="44" y="430" font-size="19" font-weight="750" class="bad">통과 2건 · 잔여 0 또는 -1</text>
<text x="366" y="88" font-size="19" font-weight="750">Lua 한 실행 범위</text><text x="366" y="112" font-size="16" font-weight="500" class="sub">조회·판단·차감을 한 번에 실행</text>
<rect x="366" y="128" width="306" height="144" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="380" y="151" font-size="16" font-weight="650" class="blue">A의 Lua 실행 1회</text>
<rect x="378" y="163" width="282" height="30" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="398" cy="178" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="398" y="184" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="420" y="184" font-size="17" font-weight="600">조회</text><text x="648" y="184" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 1</text>
<rect x="378" y="197" width="282" height="30" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="398" cy="212" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="398" y="218" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="420" y="218" font-size="17" font-weight="600">판단</text><text x="648" y="218" font-size="17" font-weight="650" text-anchor="end" class="ink">통과</text>
<rect x="378" y="231" width="282" height="30" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="398" cy="246" r="11" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="398" y="252" font-size="16" font-weight="700" text-anchor="middle" style="fill:#285fbc">A</text><text x="420" y="252" font-size="17" font-weight="600">차감</text><text x="648" y="252" font-size="17" font-weight="650" text-anchor="end" class="sub">잔여 0</text>
<rect x="366" y="286" width="306" height="72" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="380" y="308" font-size="16" font-weight="650" class="blue">B의 Lua 실행 (A가 끝난 뒤)</text>
<rect x="378" y="318" width="282" height="30" rx="5" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="398" cy="333" r="11" fill="#fff" stroke="#96501c" stroke-width="2"/><text x="398" y="339" font-size="16" font-weight="700" text-anchor="middle" style="fill:#96501c">B</text><text x="420" y="339" font-size="17" font-weight="600">조회·판단</text><text x="648" y="339" font-size="17" font-weight="650" text-anchor="end" class="warn">잔여 0 → 거절</text>
<rect x="366" y="376" width="306" height="70" rx="5" fill="#e4f2eb" stroke="#157458" stroke-width="1.5"/><text x="382" y="400" font-size="16" font-weight="600" class="sub">남는 상태</text><text x="382" y="430" font-size="19" font-weight="750" class="ok">통과 1건 · 잔여 0</text>
<text x="28" y="472" font-size="16" font-weight="500" class="sub">위에서 아래로 시간 순서</text>
</svg>
