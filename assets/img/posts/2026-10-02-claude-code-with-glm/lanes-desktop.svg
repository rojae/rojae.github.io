<svg xmlns="http://www.w3.org/2000/svg" width="700" height="576" viewBox="0 0 700 576" role="img" aria-labelledby="lanes-d-title lanes-d-desc"><title id="lanes-d-title">두 명령, 같은 프로그램, 한 규칙 파일</title><desc id="lanes-d-desc">claude 명령은 Claude Code를 기본 설정 그대로 실행해 Anthropic API로 요청합니다. claude-glm 명령은 같은 Claude Code를 ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_MODEL을 이 프로세스에만 설정해 실행하고 api.z.ai의 GLM 모델로 요청합니다. 두 명령 모두 같은 규칙을 읽습니다. 폴더에 CLAUDE.md가 있으면 그것만 읽고, 없으면 v2.1.277부터 AGENTS.md를 직접 읽습니다. CLAUDE.md는 @AGENTS.md import나 심볼릭 링크로 AGENTS.md를 가져올 수 있습니다. codex는 AGENTS.md를 직접 읽습니다. 두 명령 사이의 자동 위임은 AGENTS.md 규칙으로 막아 둡니다.</desc><defs><marker id="lanes-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="lanes-d-arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}.mut{fill:#52677c}.acc{fill:#285fbc}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="24" y="34" font-size="16" font-weight="600" class="mut">명령</text>
<text x="214" y="34" font-size="16" font-weight="600" class="mut">같은 프로그램</text>
<text x="508" y="34" font-size="16" font-weight="600" class="mut">응답하는 API</text>
<rect x="214" y="48" width="250" height="232" rx="8" fill="#f6f9fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="339" y="76" font-size="19" font-weight="750" text-anchor="middle">Claude Code</text>
<rect x="24" y="92" width="150" height="46" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="99" y="121" font-size="18" font-weight="700" text-anchor="middle" class="mono">claude</text>
<rect x="230" y="92" width="218" height="46" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="339" y="121" font-size="17" font-weight="600" text-anchor="middle">기본 설정 그대로</text>
<path d="M174 115H226" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#lanes-d-arrow)"/>
<path d="M448 115H504" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#lanes-d-arrow)"/>
<rect x="508" y="92" width="168" height="46" rx="6" fill="#fff" stroke="#52677c" stroke-width="1.5"/>
<text x="592" y="121" font-size="17" font-weight="700" text-anchor="middle">Anthropic API</text>
<path d="M60 138V185" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="5 5"/>
<text x="72" y="159" font-size="16" font-weight="600" class="mut">자동 위임 금지</text>
<text x="72" y="179" font-size="16" font-weight="600" class="mut">(규칙)</text>
<rect x="24" y="185" width="150" height="46" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="99" y="214" font-size="18" font-weight="700" text-anchor="middle" class="mono">claude-glm</text>
<text x="24" y="258" font-size="16" font-weight="500" class="mut">둘 다 사람이 실행</text>
<rect x="230" y="152" width="218" height="112" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="242" y="177" font-size="16" font-weight="600" class="mono">ANTHROPIC_BASE_URL</text>
<text x="242" y="199" font-size="16" font-weight="600" class="mono">ANTHROPIC_AUTH_TOKEN</text>
<text x="242" y="221" font-size="16" font-weight="600" class="mono">ANTHROPIC_MODEL</text>
<text x="242" y="251" font-size="16" font-weight="650" class="acc">이 프로세스에만 설정</text>
<path d="M174 208H226" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#lanes-d-arrow)"/>
<path d="M448 208H504" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#lanes-d-arrow)"/>
<rect x="508" y="178" width="168" height="60" rx="6" fill="#fff" stroke="#52677c" stroke-width="1.5"/>
<text x="592" y="203" font-size="17" font-weight="700" text-anchor="middle" class="mono">api.z.ai</text>
<text x="592" y="226" font-size="16" font-weight="500" text-anchor="middle" class="mut">GLM 모델</text>
<path d="M24 292H676" fill="none" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="24" y="334" font-size="16" font-weight="600" class="mut">규칙 파일</text>
<path d="M300 280V348" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#lanes-d-arrow-g)"/>
<text x="292" y="334" font-size="16" font-weight="500" text-anchor="end" class="mut">CLAUDE.md 있으면</text>
<path d="M430 280V330H592V348" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#lanes-d-arrow-g)"/>
<text x="442" y="322" font-size="16" font-weight="500" class="mut">CLAUDE.md 없으면</text>
<rect x="226" y="352" width="150" height="78" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="301" y="376" font-size="17" font-weight="700" text-anchor="middle" class="mono">CLAUDE.md</text>
<text x="301" y="398" font-size="16" font-weight="500" text-anchor="middle" class="mut">AGENTS.md는</text>
<text x="301" y="420" font-size="16" font-weight="500" text-anchor="middle" class="mut">자동으로 안 읽음</text>
<path d="M376 384H504" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#lanes-d-arrow-g)"/>
<text x="440" y="376" font-size="16" font-weight="600" text-anchor="middle" class="mut"><tspan class="mono">@AGENTS.md</tspan>를</text>
<text x="440" y="404" font-size="16" font-weight="500" text-anchor="middle" class="mut">넣었을 때</text>
<rect x="508" y="352" width="168" height="56" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="592" y="376" font-size="17" font-weight="700" text-anchor="middle" class="mono">AGENTS.md</text>
<text x="592" y="398" font-size="16" font-weight="600" text-anchor="middle" class="acc">규칙 원본</text>
<rect x="24" y="450" width="150" height="46" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="99" y="479" font-size="18" font-weight="700" text-anchor="middle" class="mono">codex</text>
<path d="M174 473H592V412" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#lanes-d-arrow-g)"/>
<text x="300" y="464" font-size="16" font-weight="500" class="mut">직접 읽음</text>
<text x="24" y="530" font-size="16" font-weight="500" class="mut">AGENTS.md 직접 읽기: Claude Code v2.1.277 이상</text>
<text x="24" y="558" font-size="16" font-weight="500" class="mut">실선 = 실제 호출·읽기 · 점선 = 규칙으로 막은 연결</text>
</svg>
