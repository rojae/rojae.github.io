<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1098" viewBox="0 0 320 1098" role="img" aria-labelledby="mailflow-mobile-title mailflow-mobile-desc"><title id="mailflow-mobile-title">받는 경로와 보내는 경로, 그리고 DMARC 정렬이 어긋나는 지점</title><desc id="mailflow-mobile-desc">받는 경로(1~3단계): 발신자가 rojae@rojae.kr로 보내면 MX 조회로 mx1.improvmx.com과 mx2.improvmx.com을 찾고, ImprovMX가 받아 Gmail 받은편지함으로 전달합니다. 가비아 DNS와 ImprovMX 설정에 의존합니다. 보내는 경로(4단계): Gmail에서 보낸 사람을 rojae@rojae.kr로 고르면 smtp.gmail.com(587, TLS, 앱 비밀번호)을 거쳐 수신자에게 갑니다. 4단계에서 Gmail이 rojae@rojae.kr로 보내는 확인 메일은 받는 경로를 타고 돌아오므로 받는 경로를 먼저 끝내야 합니다. 보낸 메일의 From은 rojae@rojae.kr이지만 Return-Path와 DKIM 서명 도메인은 gmail.com이라, SPF·DKIM은 gmail.com으로 통과해도 DMARC 정렬은 되지 않습니다.</desc><defs><marker id="mailflow-mobile-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="mailflow-mobile-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style><rect width="320" height="1098" fill="#fff"/>
<text x="24" y="30" font-size="19" fill="#285fbc" font-weight="700">받는 경로 · 1~3단계</text><text x="24" y="56" font-size="17" fill="#52677c" font-weight="500">설정: 가비아 DNS + ImprovMX</text>
<path d="M40 105V151" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-mobile-arrow-blue)"/><path d="M40 183V253" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-mobile-arrow-blue)"/><path d="M40 285V331" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-mobile-arrow-blue)"/>
<circle cx="40" cy="92" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="40" cy="170" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="40" cy="272" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="40" cy="350" r="10" fill="#fff" stroke="#157458" stroke-width="2"/><path d="M35 350l3.5 3.5 6.5-6.5" fill="none" stroke="#157458" stroke-width="1.8"/>
<text x="62" y="98" font-size="19" fill="#192e42" font-weight="650">발신자</text><text x="62" y="124" font-size="17" fill="#52677c" font-weight="500" class="mono">→ rojae@rojae.kr</text>
<text x="62" y="176" font-size="19" fill="#192e42" font-weight="650">MX 조회</text><text x="62" y="202" font-size="17" fill="#52677c" font-weight="500" class="mono">mx1.improvmx.com</text><text x="62" y="226" font-size="17" fill="#52677c" font-weight="500" class="mono">mx2.improvmx.com</text>
<text x="62" y="278" font-size="19" fill="#192e42" font-weight="650">ImprovMX</text><text x="62" y="304" font-size="17" fill="#52677c" font-weight="500">받아서 Gmail로 전달</text>
<text x="62" y="356" font-size="19" fill="#192e42" font-weight="650">Gmail 받은편지함</text>
<path d="M30 512H10V92H28" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mailflow-mobile-arrow-gray)"/>
<text x="24" y="398" font-size="17" fill="#52677c" font-weight="600">↑ 4단계: Gmail이</text><text x="24" y="422" font-size="17" fill="#52677c" font-weight="600">rojae@rojae.kr로 확인 메일 발송</text>
<path d="M24 440H300" fill="none" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="24" y="476" font-size="19" fill="#285fbc" font-weight="700">보내는 경로 · 4단계</text>
<path d="M40 525V571" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-mobile-arrow-blue)"/><path d="M40 603V649" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-mobile-arrow-blue)"/>
<circle cx="40" cy="512" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="40" cy="590" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="40" cy="668" r="10" fill="#fff" stroke="#285fbc" stroke-width="2"/>
<text x="62" y="518" font-size="19" fill="#192e42" font-weight="650">Gmail 보낸 사람</text><text x="62" y="544" font-size="17" fill="#52677c" font-weight="500" class="mono">rojae@rojae.kr</text>
<text x="62" y="596" font-size="19" fill="#192e42" font-weight="650" class="mono">smtp.gmail.com</text><text x="62" y="622" font-size="17" fill="#52677c" font-weight="500">587 · TLS · 앱 비밀번호</text>
<text x="62" y="674" font-size="19" fill="#192e42" font-weight="650">수신자</text><text x="62" y="700" font-size="17" fill="#52677c" font-weight="500">상대 메일 서버</text>
<text x="24" y="746" font-size="17" fill="#96501c" font-weight="600">이 메일의 헤더 (대략적인 예시)</text>
<rect x="20" y="758" width="284" height="320" rx="6" fill="#fdf5ee" stroke="#96501c" stroke-width="1.5"/>
<text x="36" y="786" font-size="17" fill="#52677c" font-weight="500" class="mono">From</text><text x="36" y="810" font-size="17" fill="#192e42" font-weight="600" class="mono">rojae@rojae.kr</text>
<text x="36" y="840" font-size="17" fill="#52677c" font-weight="500" class="mono">Return-Path</text><text x="36" y="864" font-size="17" fill="#192e42" font-weight="600" class="mono">xxx@gmail.com</text>
<text x="36" y="894" font-size="17" fill="#52677c" font-weight="500" class="mono">DKIM</text><text x="36" y="918" font-size="17" fill="#192e42" font-weight="600" class="mono">d=gmail.com</text>
<path d="M36 938H288" fill="none" stroke="#e7cdb6" stroke-width="1.2"/>
<text x="36" y="966" font-size="17" fill="#52677c" font-weight="500">SPF·DKIM은</text><text x="36" y="990" font-size="17" fill="#52677c" font-weight="500">gmail.com으로 통과</text>
<text x="36" y="1032" font-size="18" fill="#96501c" font-weight="700">From과 도메인이 달라</text>
<text x="36" y="1060" font-size="18" fill="#96501c" font-weight="700">DMARC 정렬 안 됨</text>
</svg>
