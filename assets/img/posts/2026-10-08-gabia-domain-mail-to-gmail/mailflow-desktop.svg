<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="0 0 700 620" role="img" aria-labelledby="mailflow-desktop-title mailflow-desktop-desc"><title id="mailflow-desktop-title">받는 경로와 보내는 경로, 그리고 DMARC 정렬이 어긋나는 지점</title><desc id="mailflow-desktop-desc">받는 경로(1~3단계): 발신자가 rojae@rojae.kr로 보내면 MX 조회로 mx1.improvmx.com과 mx2.improvmx.com을 찾고, ImprovMX가 받아 Gmail 받은편지함으로 전달합니다. 가비아 DNS와 ImprovMX 설정에 의존합니다. 보내는 경로(4단계): Gmail에서 보낸 사람을 rojae@rojae.kr로 고르면 smtp.gmail.com(587, TLS, 앱 비밀번호)을 거쳐 수신자에게 갑니다. 4단계에서 Gmail이 rojae@rojae.kr로 보내는 확인 메일은 받는 경로를 타고 돌아오므로 받는 경로를 먼저 끝내야 합니다. 보낸 메일의 From은 rojae@rojae.kr이지만 Return-Path와 DKIM 서명 도메인은 gmail.com이라, SPF·DKIM은 gmail.com으로 통과해도 DMARC 정렬은 되지 않습니다.</desc><defs><marker id="mailflow-desktop-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="mailflow-desktop-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="mailflow-desktop-arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#96501c" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style><rect width="700" height="620" fill="#fff"/>
<text x="36" y="35" font-size="18" fill="#285fbc" font-weight="700">받는 경로 · 1~3단계</text><text x="672" y="35" font-size="16" fill="#52677c" font-weight="500" text-anchor="end">설정: 가비아 DNS + ImprovMX</text>
<path d="M110 85H248" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-desktop-arrow-blue)"/><path d="M280 85H418" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-desktop-arrow-blue)"/><path d="M450 85H588" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-desktop-arrow-blue)"/>
<circle cx="95" cy="85" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="265" cy="85" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="435" cy="85" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="605" cy="85" r="12" fill="#fff" stroke="#157458" stroke-width="2"/><path d="M599 85l4 4 8-8" fill="none" stroke="#157458" stroke-width="1.8"/>
<text x="95" y="128" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">발신자</text><text x="95" y="154" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle" class="mono">rojae@rojae.kr</text><text x="95" y="178" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">로 발송</text>
<text x="265" y="128" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">MX 조회</text><text x="265" y="154" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle" class="mono">mx1.improvmx.com</text><text x="265" y="178" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle" class="mono">mx2.improvmx.com</text>
<text x="435" y="128" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">ImprovMX</text><text x="435" y="154" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">받아서 Gmail로 전달</text>
<text x="605" y="128" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">Gmail</text><text x="605" y="154" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">받은편지함</text>
<path d="M36 222H672" fill="none" stroke="#cdd8e3" stroke-width="1.5"/>
<path d="M83 320H16V85H79" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mailflow-desktop-arrow-gray)"/>
<text x="26" y="210" font-size="16" fill="#52677c" font-weight="600">↑ 4단계: Gmail이 rojae@rojae.kr로 확인 메일 발송</text>
<text x="36" y="262" font-size="18" fill="#285fbc" font-weight="700">보내는 경로 · 4단계</text><text x="672" y="262" font-size="16" fill="#52677c" font-weight="500" text-anchor="end">설정: Gmail만</text>
<path d="M110 320H333" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-desktop-arrow-blue)"/><path d="M365 320H588" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#mailflow-desktop-arrow-blue)"/>
<circle cx="95" cy="320" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="350" cy="320" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/><circle cx="605" cy="320" r="12" fill="#fff" stroke="#285fbc" stroke-width="2"/>
<text x="95" y="363" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">Gmail 보낸 사람</text><text x="95" y="389" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle" class="mono">rojae@rojae.kr</text><text x="95" y="413" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">선택</text>
<text x="350" y="363" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle" class="mono">smtp.gmail.com</text><text x="350" y="389" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">587 · TLS · 앱 비밀번호</text>
<text x="605" y="363" font-size="18" fill="#192e42" font-weight="650" text-anchor="middle">수신자</text><text x="605" y="389" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">상대 메일 서버</text>
<path d="M477 328V450" fill="none" stroke="#96501c" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mailflow-desktop-arrow-warn)"/><text x="489" y="435" font-size="16" fill="#96501c" font-weight="600">이 메일의 헤더</text>
<rect x="28" y="458" width="644" height="140" rx="6" fill="#fdf5ee" stroke="#96501c" stroke-width="1.5"/>
<text x="52" y="492" font-size="17" fill="#52677c" font-weight="500" class="mono">From</text><text x="186" y="492" font-size="17" fill="#192e42" font-weight="600" class="mono">rojae@rojae.kr</text>
<text x="52" y="520" font-size="17" fill="#52677c" font-weight="500" class="mono">Return-Path</text><text x="186" y="520" font-size="17" fill="#192e42" font-weight="600" class="mono">xxx@gmail.com</text>
<text x="52" y="548" font-size="17" fill="#52677c" font-weight="500" class="mono">DKIM</text><text x="186" y="548" font-size="17" fill="#192e42" font-weight="600" class="mono">d=gmail.com</text>
<text x="400" y="506" font-size="17" fill="#52677c" font-weight="500">SPF·DKIM은 gmail.com으로 통과</text>
<text x="400" y="536" font-size="18" fill="#96501c" font-weight="700">From과 도메인이 달라</text>
<text x="400" y="562" font-size="18" fill="#96501c" font-weight="700">DMARC 정렬 안 됨</text>
<text x="52" y="582" font-size="16" fill="#52677c" font-weight="500">헤더는 대략적인 예시입니다</text>
</svg>
