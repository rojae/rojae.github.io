<svg xmlns="http://www.w3.org/2000/svg" width="700" height="484" viewBox="0 0 700 484" role="img" aria-labelledby="path-desktop-title path-desktop-desc"><title id="path-desktop-title">토큰이 브라우저까지 오는 길과 두 실패 지점</title><desc id="path-desktop-desc">토큰은 Orca Router에서 Spring WebFlux 프록시(8090), nginx(8081·8082·8083)를 거쳐 브라우저 EventSource로 갑니다. Spring 직접 연결까지는 토큰이 20개 시점에 나뉘어 흘렀습니다. 원인 2는 gzip을 켠 8083에서 nginx의 gzip 필터가 flush 표시 없는 청크를 모아 둔 것(이번 응답은 끝까지 보류), 원인 1은 브라우저 파서가 data: 뒤 공백 한 칸을 구분자로 버린 것입니다. 측정은 curl -N으로 업스트림과 Spring의 원문을, stream_timing.py로 Spring과 nginx 경로의 도착 시각을, 데모 페이지로 브라우저 타임라인을 확인했습니다.</desc><defs><marker id="path-desktop-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style><rect width="700" height="484" fill="#fff"/>
<!-- measurement labels -->
<text x="20" y="30" font-size="16" font-weight="700" style="fill:#52677c">측정한 위치</text>
<text x="168" y="58" font-size="16" font-weight="600" text-anchor="middle" class="mono" style="fill:#52677c">curl -N</text>
<text x="168" y="80" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">원문</text>
<path d="M91 94H245M91 94V146M245 94V146" fill="none" stroke="#52677c" stroke-width="1.4"/><circle cx="91" cy="148" r="4" fill="#52677c"/><circle cx="245" cy="148" r="4" fill="#52677c"/>
<text x="360" y="58" font-size="16" font-weight="600" text-anchor="middle" class="mono" style="fill:#52677c">stream_timing.py</text>
<text x="360" y="80" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">도착 시각</text>
<path d="M285 94H435M285 94V146M435 94V146" fill="none" stroke="#52677c" stroke-width="1.4"/><circle cx="285" cy="148" r="4" fill="#52677c"/><circle cx="435" cy="148" r="4" fill="#52677c"/>
<text x="607" y="58" font-size="16" font-weight="600" text-anchor="middle" style="fill:#52677c">데모 페이지</text>
<text x="607" y="80" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">타임라인</text>
<path d="M607 94V146" fill="none" stroke="#52677c" stroke-width="1.4"/><circle cx="607" cy="148" r="4" fill="#52677c"/>
<!-- nodes -->
<rect x="20" y="152" width="142" height="76" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="91" y="185" font-size="18" font-weight="700" text-anchor="middle">Orca Router</text>
<text x="91" y="211" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">업스트림 LLM</text>
<rect x="192" y="152" width="142" height="76" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="263" y="185" font-size="18" font-weight="700" text-anchor="middle">Spring</text>
<text x="263" y="211" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">WebFlux · 8090</text>
<rect x="364" y="152" width="142" height="76" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="435" y="185" font-size="18" font-weight="700" text-anchor="middle">nginx 1.27</text>
<text x="435" y="211" font-size="16" font-weight="500" text-anchor="middle" style="fill:#52677c">8081~8083</text>
<rect x="536" y="152" width="142" height="76" rx="6" fill="#fff" stroke="#192e42" stroke-width="1.5"/>
<text x="607" y="185" font-size="18" font-weight="700" text-anchor="middle">브라우저</text>
<text x="607" y="211" font-size="16" font-weight="500" text-anchor="middle" class="mono" style="fill:#52677c">EventSource</text>
