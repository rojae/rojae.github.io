<circle cx="378" cy="262" r="12" fill="#fff" stroke="#b33c42" stroke-width="2"/><text x="378" y="268" font-size="16" font-weight="700" text-anchor="middle" style="fill:#b33c42">2</text>
<text x="398" y="268" font-size="17" font-weight="700" style="fill:#b33c42">원인 2</text>
<text x="364" y="294" font-size="16" font-weight="600" style="fill:#b33c42">(gzip on · 8083)</text>
<text x="364" y="320" font-size="16" font-weight="500">gzip 필터가</text>
<text x="364" y="342" font-size="16" font-weight="500">flush 표시 없는 청크를</text>
<text x="364" y="364" font-size="16" font-weight="500">모아 둠(이번엔 끝까지)</text>
<!-- failure 1 -->
<path d="M550 228V250" fill="none" stroke="#b33c42" stroke-width="1.7"/>
<circle cx="550" cy="262" r="12" fill="#fff" stroke="#b33c42" stroke-width="2"/><text x="550" y="268" font-size="16" font-weight="700" text-anchor="middle" style="fill:#b33c42">1</text>
<text x="570" y="268" font-size="17" font-weight="700" style="fill:#b33c42">원인 1</text>
<text x="536" y="298" font-size="16" font-weight="500">파서가</text>
<text x="536" y="320" font-size="16" font-weight="500" class="mono">data:</text><text x="586" y="320" font-size="16" font-weight="500">뒤 공백</text>
<text x="536" y="342" font-size="16" font-weight="500">한 칸을 버림</text>
