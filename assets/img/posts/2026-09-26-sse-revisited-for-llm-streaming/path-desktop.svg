<text x="20" y="298" font-size="16" font-weight="500" style="fill:#52677c">Spring 직접 연결:</text>
<text x="20" y="320" font-size="16" font-weight="500" style="fill:#52677c">토큰 121개가 20개 시점에 도착</text>
