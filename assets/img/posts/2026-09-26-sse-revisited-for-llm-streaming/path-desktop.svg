<path d="M20 396H680" fill="none" stroke="#cdd8e3" stroke-width="1.5"/>
<path d="M20 426H52" fill="none" stroke="#285fbc" stroke-width="2.2" marker-end="url(#path-desktop-arrow-blue)"/><text x="62" y="432" font-size="16" font-weight="500" style="fill:#52677c">토큰 경로</text>
<path d="M160 420V434" fill="none" stroke="#52677c" stroke-width="1.4"/><circle cx="160" cy="434" r="4" fill="#52677c"/><text x="174" y="432" font-size="16" font-weight="500" style="fill:#52677c">측정한 위치</text>
<circle cx="296" cy="426" r="12" fill="#fff" stroke="#b33c42" stroke-width="2"/><text x="296" y="432" font-size="16" font-weight="700" text-anchor="middle" style="fill:#b33c42">n</text><text x="316" y="432" font-size="16" font-weight="500" style="fill:#52677c">실패 지점 (본문의 원인 번호)</text>
<text x="20" y="466" font-size="17" font-weight="700">두 지점 모두 자기 규칙대로 동작했을 뿐입니다.</text>
