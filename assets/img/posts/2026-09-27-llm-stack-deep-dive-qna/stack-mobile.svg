<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1292" viewBox="0 0 320 1292" role="img" aria-labelledby="title desc"><title id="title">응답이 지나는 자리: 메시지 내용은 얇고, 문제는 싣는 방식과 앞뒤 장비에서 났습니다</title><desc id="desc">설명용 그림. 응답이 업스트림 LLM, 게이트웨이, 앱/MCP 서버, nginx/LB, 클라이언트 순서로 지나갑니다. 각 자리 옆에 그 자리에서 난 문제와 질문 번호를 적었습니다. 업스트림: 무료 한도(안내상 분당 10회, 단위 미확인), usage가 마지막 청크에 와서 비용 확정이 늦음. 게이트웨이: 가상 키별 rpm_limit, 쿨다운, 응답 뒤 비용 집계. 앱/MCP 서버는 셋으로 나눴습니다. 메시지 자체(data: 한 줄, JSON-RPC 한 줄)는 문제가 없었습니다. 메시지를 싣는 방식에서는 파서가 공백을 버려 JSON으로 감싼 것(1편 원인 1), stdout 오염(3편 원인 1), flush(A4)가 문제였습니다. 프레임워크 설정에서는 스타터 충돌로 통로가 안 열렸습니다(3편 원인 4). nginx/LB: gzip·버퍼·read timeout, 인스턴스가 여럿이면 세션 고정. 클라이언트: JSON 아닌 stdout 줄을 넘김. LLM 경로와 MCP 경로를 한 줄에 겹쳤습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="16" y="26" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">응답이 지나는 순서 (위 → 아래)</text><text x="16" y="47" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">상자 아래: 그 자리에서 난 문제</text><rect x="16" y="62" width="288" height="56" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="30" y="98" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">업스트림 LLM</text><text x="290" y="98" font-size="17" style="fill:#96501c" font-weight="650" text-anchor="end">문제 난 자리</text><rect x="22" y="128" width="282" height="90" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="152" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">무료 한도(단위 미확인)</text><text x="34" y="178" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">비용 확정이 늦다</text><text x="34" y="204" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">B1 · B2 · B3</text><path d="M160 226L160 258" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="16" y="270" width="288" height="56" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="30" y="306" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">게이트웨이</text><text x="290" y="306" font-size="17" style="fill:#96501c" font-weight="650" text-anchor="end">문제 난 자리</text><rect x="22" y="336" width="282" height="90" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="360" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">가상 키별 rpm_limit</text><text x="34" y="386" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">쿨다운 · 비용 집계</text><text x="34" y="412" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">B1 · B2 · B3</text><path d="M160 434L160 466" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="16" y="478" width="288" height="56" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="30" y="514" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">앱 / MCP 서버</text><text x="290" y="514" font-size="17" style="fill:#52677c" font-weight="650" text-anchor="end">셋으로 나눔</text><rect x="22" y="544" width="282" height="90" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1"/><text x="34" y="568" font-size="17" style="fill:#285fbc" font-weight="700" text-anchor="start">메시지 자체 — 얇다</text><text x="34" y="594" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">data: 한 줄, JSON-RPC 한 줄</text><text x="34" y="620" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">C1</text><rect x="22" y="642" width="282" height="142" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="666" font-size="17" style="fill:#96501c" font-weight="700" text-anchor="start">싣는 방식 — 문제 난 자리</text><text x="34" y="692" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">공백 → JSON 감싸기(1편 원인 1)</text><text x="34" y="718" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">stdout 오염(3편 원인 1)</text><text x="34" y="744" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">flush(A4)</text><text x="34" y="770" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">A4 · C4</text><rect x="22" y="792" width="282" height="90" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="816" font-size="17" style="fill:#96501c" font-weight="700" text-anchor="start">프레임워크 설정 — 문제 난 자리</text><text x="34" y="842" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">통로가 안 열림(3편 원인 4)</text><text x="34" y="868" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">3편 원인 4</text><path d="M160 890L160 922" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="16" y="934" width="288" height="56" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="30" y="970" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">nginx / LB</text><text x="290" y="970" font-size="17" style="fill:#96501c" font-weight="650" text-anchor="end">문제 난 자리</text><rect x="22" y="1000" width="282" height="90" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="1024" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">gzip · 버퍼 · read timeout</text><text x="34" y="1050" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">세션 고정 · stdio엔 없음</text><text x="34" y="1076" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">A1 · A2 · A3 · C2</text><path d="M160 1098L160 1130" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="16" y="1142" width="288" height="56" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="30" y="1178" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">클라이언트</text><text x="290" y="1178" font-size="17" style="fill:#96501c" font-weight="650" text-anchor="end">문제 난 자리</text><rect x="22" y="1208" width="282" height="64" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><text x="34" y="1232" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start">JSON 아닌 stdout 줄을 넘김</text><text x="34" y="1258" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">C3 · C4</text></svg>