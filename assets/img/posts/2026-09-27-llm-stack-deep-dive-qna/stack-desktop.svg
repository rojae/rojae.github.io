<svg xmlns="http://www.w3.org/2000/svg" width="700" height="884" viewBox="0 0 700 884" role="img" aria-labelledby="title desc"><title id="title">응답이 지나는 자리: 메시지 내용은 얇고, 문제는 싣는 방식과 앞뒤 장비에서 났습니다</title><desc id="desc">설명용 그림. 응답이 업스트림 LLM, 게이트웨이, 앱/MCP 서버, nginx/LB, 클라이언트 순서로 지나갑니다. 각 자리 옆에 그 자리에서 난 문제와 질문 번호를 적었습니다. 업스트림: 무료 한도(안내상 분당 10회, 단위 미확인), usage가 마지막 청크에 와서 비용 확정이 늦음. 게이트웨이: 가상 키별 rpm_limit, 쿨다운, 응답 뒤 비용 집계. 앱/MCP 서버는 셋으로 나눴습니다. 메시지 자체(data: 한 줄, JSON-RPC 한 줄)는 문제가 없었습니다. 메시지를 싣는 방식에서는 파서가 공백을 버려 JSON으로 감싼 것(1편 원인 1), stdout 오염(3편 원인 1), flush(A4)가 문제였습니다. 프레임워크 설정에서는 스타터 충돌로 통로가 안 열렸습니다(3편 원인 4). nginx/LB: gzip·버퍼·read timeout, 인스턴스가 여럿이면 세션 고정. 클라이언트: JSON 아닌 stdout 줄을 넘김. LLM 경로와 MCP 경로를 한 줄에 겹쳤습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">응답이 지나는 순서 (위 → 아래)</text><text x="676" y="34" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="end">오른쪽: 그 자리에서 난 문제</text><rect x="24" y="60" width="200" height="92" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="42" y="102.0" font-size="20" style="fill:#192e42" font-weight="750" text-anchor="start">업스트림 LLM</text><text x="42" y="128.0" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">문제 난 자리</text><rect x="240" y="60" width="436" height="92" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 106.0L240 106.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="88" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">무료 한도(안내상 분당 10회, 단위 미확인)</text><text x="256" y="112" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">비용 확정이 늦다(usage는 마지막 청크)</text><text x="256" y="136" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">B1 · B2 · B3</text><rect x="24" y="186" width="200" height="92" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="42" y="228.0" font-size="20" style="fill:#192e42" font-weight="750" text-anchor="start">게이트웨이</text><text x="42" y="254.0" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">문제 난 자리</text><rect x="240" y="186" width="436" height="92" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 232.0L240 232.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="214" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">가상 키별 rpm_limit · 쿨다운</text><text x="256" y="238" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">비용 집계는 응답이 끝난 뒤</text><text x="256" y="262" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">B1 · B2 · B3</text><rect x="24" y="312" width="200" height="316" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="42" y="466.0" font-size="20" style="fill:#192e42" font-weight="750" text-anchor="start">앱 / MCP 서버</text><text x="42" y="492.0" font-size="16" style="fill:#52677c" font-weight="650" text-anchor="start">셋으로 나눔</text><rect x="240" y="312" width="436" height="92" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1"/><path d="M224 358.0L240 358.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="340" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="start">메시지 자체 — 얇다, 문제 없음</text><text x="256" y="364" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">data: 한 줄, JSON-RPC 한 줄</text><text x="256" y="388" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">C1</text><rect x="240" y="412" width="436" height="116" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 470.0L240 470.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="440" font-size="16" style="fill:#96501c" font-weight="700" text-anchor="start">싣는 방식 — 문제 난 자리</text><text x="256" y="464" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">파서가 공백을 버림 → JSON 감싸기(1편 원인 1)</text><text x="256" y="488" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">stdout 오염(3편 원인 1) · flush(A4)</text><text x="256" y="512" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">A4 · C4</text><rect x="240" y="536" width="436" height="92" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 582.0L240 582.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="564" font-size="16" style="fill:#96501c" font-weight="700" text-anchor="start">프레임워크 설정 — 문제 난 자리</text><text x="256" y="588" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">스타터 충돌로 통로가 안 열림(3편 원인 4)</text><text x="256" y="612" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">3편 원인 4</text><rect x="24" y="662" width="200" height="92" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="42" y="704.0" font-size="20" style="fill:#192e42" font-weight="750" text-anchor="start">nginx / LB</text><text x="42" y="730.0" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">문제 난 자리</text><rect x="240" y="662" width="436" height="92" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 708.0L240 708.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="690" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">gzip · 버퍼(flush 표시) · read timeout</text><text x="256" y="714" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">인스턴스 여럿이면 세션 고정 · stdio엔 없음</text><text x="256" y="738" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">A1 · A2 · A3 · C2</text><rect x="24" y="788" width="200" height="68" rx="6" fill="#fff" stroke="#192e42" stroke-width="3"/><text x="42" y="818.0" font-size="20" style="fill:#192e42" font-weight="750" text-anchor="start">클라이언트</text><text x="42" y="844.0" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">문제 난 자리</text><rect x="240" y="788" width="436" height="68" rx="6" fill="#f5f8fb" stroke="#cdd8e3" stroke-width="1"/><path d="M224 822.0L240 822.0" stroke="#cdd8e3" stroke-width="1.5"/><text x="256" y="816" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start">JSON 아닌 stdout 줄을 넘김(관대함)</text><text x="256" y="840" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">C3 · C4</text><path d="M124 156L124 180" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M124 282L124 306" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M124 632L124 656" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M124 758L124 782" fill="none" stroke="#285fbc" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M24 870L676 870" stroke="#cdd8e3" stroke-width="1.5"/></svg>