<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="fig02-state-desktop-title fig02-state-desktop-desc"><title id="fig02-state-desktop-title">원자적 갱신과 상태 전파의 서로 다른 경로</title><desc id="fig02-state-desktop-desc">장애 관측은 Redis Lua의 장애 횟수 갱신으로 들어간다. 원자적 실행은 이 범위에 한정한다. 별도로 인증사 상태 변경 알림은 Redis Pub/Sub에서 각 인스턴스의 Caffeine 로컬 상태 캐시로 전달된다. 상태 조회는 이 캐시를 사용한다. RDB 원본에서 캐시로 주기 재동기화하는 별도 경로가 알림 누락을 보완한다.</desc><defs><marker id="fig02-state-desktop-arrow-637387" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fig02-state-desktop-arrow-275ca0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fig02-state-desktop-arrow-187554" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fig02-state-desktop-arrow-b33e3e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}</style><rect width="700" height="500" fill="#fff"/><text x="28" y="35" font-size="18" fill="#52677c" text-anchor="start" font-weight="650">장애 집계</text><text x="28" y="93" font-size="18" fill="#192e42" text-anchor="start" font-weight="500">서버별</text><text x="28" y="119" font-size="18" fill="#192e42" text-anchor="start" font-weight="500">장애 관측</text><path d="M125 90H202" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-275ca0)"/><path d="M125 120H202" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-275ca0)"/><rect x="210" y="52" width="233" height="105" rx="5" fill="#f0f5fc" stroke="#285fbc" stroke-width="1.5"/><text x="326" y="87" font-size="23" fill="#285fbc" text-anchor="middle" font-weight="700">Redis Lua</text><text x="326" y="119" font-size="18" fill="#285fbc" text-anchor="middle" font-weight="500">장애 횟수 갱신</text><text x="466" y="88" font-size="18" fill="#285fbc" text-anchor="start" font-weight="500">이 범위만</text><text x="466" y="115" font-size="18" fill="#285fbc" text-anchor="start" font-weight="500">원자적으로 실행</text><path d="M28 182H672" fill="none" stroke="#cbd5df" stroke-width="1.7"/><text x="28" y="214" font-size="18" fill="#52677c" text-anchor="start" font-weight="650">상태 전파·조회</text><circle cx="46" cy="265" r="5" fill="#52677c" stroke="#52677c" stroke-width="2"/><text x="28" y="304" font-size="17" fill="#192e42" text-anchor="start" font-weight="500">인증사</text><text x="28" y="329" font-size="17" fill="#192e42" text-anchor="start" font-weight="500">상태 변경</text><path d="M51 265H221" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-275ca0)"/><text x="138" y="252" font-size="17" fill="#285fbc" text-anchor="middle" font-weight="500">발행</text><rect x="229" y="241" width="174" height="49" rx="5" fill="#f0f5fc" stroke="#285fbc" stroke-width="1.5"/><text x="316" y="272" font-size="20" fill="#285fbc" text-anchor="middle" font-weight="650">Redis Pub/Sub</text><path d="M403 265H487" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-275ca0)"/><text x="445" y="247" font-size="17" fill="#285fbc" text-anchor="middle" font-weight="500">알림</text><rect x="495" y="244" width="174" height="113" rx="5" fill="#fafbfd" stroke="#52677c" stroke-width="1.5"/><text x="582" y="272" font-size="17" fill="#52677c" text-anchor="middle" font-weight="500">각 인스턴스</text><text x="582" y="306" font-size="23" fill="#285fbc" text-anchor="middle" font-weight="700">Caffeine</text><text x="582" y="334" font-size="17" fill="#52677c" text-anchor="middle" font-weight="500">로컬 상태 캐시</text><text x="582" y="207" font-size="18" fill="#192e42" text-anchor="middle" font-weight="500">상태 조회</text><path d="M582 216V238" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-637387)"/><ellipse cx="316" cy="389" rx="66" ry="13" fill="#f4f8f6" stroke="#157458" stroke-width="1.5"/><path d="M250 389V422C250 439 382 439 382 422V389" fill="#f4f8f6" stroke="#157458" stroke-width="1.5"/><text x="316" y="417" font-size="18" fill="#157458" text-anchor="middle" font-weight="650">RDB 원본</text><path d="M382 410H582V364" fill="none" stroke="#157458" stroke-width="1.7" marker-end="url(#fig02-state-desktop-arrow-187554)"/><text x="494" y="400" font-size="17" fill="#157458" text-anchor="middle" font-weight="500">주기 재동기화</text><text x="28" y="474" font-size="18" fill="#192e42" text-anchor="start" font-weight="650">알림 누락은 원본 재조회로 보완한다.</text></svg>