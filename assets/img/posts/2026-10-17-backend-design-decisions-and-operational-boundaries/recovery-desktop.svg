<svg xmlns="http://www.w3.org/2000/svg" width="700" height="475" viewBox="0 0 700 475" role="img" aria-labelledby="fig03-recovery-desktop-title fig03-recovery-desktop-desc"><title id="fig03-recovery-desktop-title">구현한 재시도와 구현하지 않은 정상 복귀</title><desc id="fig03-recovery-desktop-desc">실선 구현 경로는 장애 인증사 비활성화, 대체 인증사로 비율 조정, 로컬 TTL 10분 만료, 비율 보정 및 재시도 순서다. 점선의 별도 경로는 정상화 확인 후 원래 요청 비율로 자동 복귀하는 기능이며 설계 검토했지만 구현하지 않았다. TTL 만료는 정상화의 증거가 아니다.</desc><defs><marker id="fig03-recovery-desktop-arrow-637387" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fig03-recovery-desktop-arrow-275ca0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fig03-recovery-desktop-arrow-187554" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fig03-recovery-desktop-arrow-b33e3e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}</style><rect width="700" height="475" fill="#fff"/><text x="28" y="35" font-size="18" fill="#285fbc" text-anchor="start" font-weight="700">구현한 재시도 경로</text><path d="M85 95H235" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig03-recovery-desktop-arrow-275ca0)"/><path d="M265 95H415" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig03-recovery-desktop-arrow-275ca0)"/><path d="M445 95H595" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig03-recovery-desktop-arrow-275ca0)"/><circle cx="70" cy="95" r="12" fill="white" stroke="#b33c42" stroke-width="2"/><circle cx="250" cy="95" r="12" fill="white" stroke="#285fbc" stroke-width="2"/><circle cx="430" cy="95" r="12" fill="white" stroke="#285fbc" stroke-width="2"/><circle cx="610" cy="95" r="12" fill="white" stroke="#285fbc" stroke-width="2"/><path d="M65 90L75 100" fill="none" stroke="#b33c42" stroke-width="1.7"/><path d="M75 90L65 100" fill="none" stroke="#b33c42" stroke-width="1.7"/><text x="70" y="138" font-size="18" fill="#192e42" text-anchor="middle" font-weight="650">장애 인증사</text><text x="70" y="165" font-size="18" fill="#52677c" text-anchor="middle" font-weight="500">비활성화</text><text x="250" y="138" font-size="18" fill="#192e42" text-anchor="middle" font-weight="650">대체 인증사</text><text x="250" y="165" font-size="18" fill="#52677c" text-anchor="middle" font-weight="500">비율 조정</text><text x="430" y="138" font-size="18" fill="#192e42" text-anchor="middle" font-weight="650">로컬 TTL</text><text x="430" y="165" font-size="18" fill="#52677c" text-anchor="middle" font-weight="500">10분 만료</text><text x="610" y="138" font-size="18" fill="#192e42" text-anchor="middle" font-weight="650">비율 보정</text><text x="610" y="165" font-size="18" fill="#52677c" text-anchor="middle" font-weight="500">재시도</text><path d="M610 177V240H260V286" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#fig03-recovery-desktop-arrow-637387)"/><text x="28" y="232" font-size="18" fill="#52677c" text-anchor="start" font-weight="650">설계 검토</text><text x="28" y="258" font-size="18" fill="#52677c" text-anchor="start" font-weight="500">미구현</text><circle cx="260" cy="306" r="13" fill="white" stroke="#157458" stroke-width="2" stroke-dasharray="4 3"/><circle cx="530" cy="306" r="13" fill="white" stroke="#157458" stroke-width="2" stroke-dasharray="4 3"/><path d="M279 306H509" fill="none" stroke="#157458" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#fig03-recovery-desktop-arrow-187554)"/><text x="260" y="350" font-size="20" fill="#192e42" text-anchor="middle" font-weight="650">정상화 확인</text><text x="530" y="350" font-size="20" fill="#192e42" text-anchor="middle" font-weight="650">원래 요청 비율</text><text x="530" y="379" font-size="18" fill="#52677c" text-anchor="middle" font-weight="500">자동 복귀</text><path d="M28 414H672" fill="none" stroke="#dce3e9" stroke-width="1.7"/><text x="28" y="448" font-size="21" fill="#192e42" text-anchor="start" font-weight="700">TTL 만료는 정상화 확인이 아니다.</text></svg>