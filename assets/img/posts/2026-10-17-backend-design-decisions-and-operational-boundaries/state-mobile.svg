<svg xmlns="http://www.w3.org/2000/svg" width="300" height="744" viewBox="0 0 300 744" role="img" aria-labelledby="fig02-state-mobile-title fig02-state-mobile-desc"><title id="fig02-state-mobile-title">원자적 갱신과 상태 전파의 서로 다른 경로</title><desc id="fig02-state-mobile-desc">Lua는 장애 횟수 갱신의 원자적 범위다. 별도의 상태 변경 알림은 Redis Pub/Sub에서 각 인스턴스의 Caffeine으로 전달된다. RDB 원본 재조회는 로컬 상태 캐시에 주기적으로 다시 맞추는 별도 경로다.</desc><defs><marker id="fig02-state-mobile-arrow-637387" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fig02-state-mobile-arrow-275ca0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fig02-state-mobile-arrow-187554" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fig02-state-mobile-arrow-b33e3e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}</style><rect width="300" height="744" fill="#fff"/><text x="18" y="30" font-size="16" fill="#52677c" text-anchor="start" font-weight="650">장애 집계</text><text x="150" y="66" font-size="18" fill="#192e42" text-anchor="middle" font-weight="500">서버별 장애 관측</text><path d="M150 78V102" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-mobile-arrow-275ca0)"/><rect x="47" y="110" width="206" height="91" rx="5" fill="#f0f5fc" stroke="#285fbc" stroke-width="1.5"/><text x="150" y="143" font-size="22" fill="#285fbc" text-anchor="middle" font-weight="700">Redis Lua</text><text x="150" y="172" font-size="17" fill="#285fbc" text-anchor="middle" font-weight="500">장애 횟수 갱신</text><text x="150" y="226" font-size="16" fill="#285fbc" text-anchor="middle" font-weight="500">이 범위만 원자적으로 실행</text><path d="M18 248H282" fill="none" stroke="#cbd5df" stroke-width="1.7"/><text x="18" y="280" font-size="16" fill="#52677c" text-anchor="start" font-weight="650">상태 전파·조회</text><text x="150" y="318" font-size="18" fill="#192e42" text-anchor="middle" font-weight="500">인증사 상태 변경</text><path d="M150 330V353" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-mobile-arrow-275ca0)"/><rect x="55" y="361" width="190" height="48" rx="5" fill="#f0f5fc" stroke="#285fbc" stroke-width="1.5"/><text x="150" y="391" font-size="20" fill="#285fbc" text-anchor="middle" font-weight="650">Redis Pub/Sub</text><path d="M150 409V472" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#fig02-state-mobile-arrow-275ca0)"/><text x="164" y="445" font-size="16" fill="#285fbc" text-anchor="start" font-weight="500">변경 알림</text><rect x="55" y="480" width="190" height="108" rx="5" fill="#fafbfd" stroke="#52677c" stroke-width="1.5"/><text x="150" y="507" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">각 인스턴스</text><text x="150" y="538" font-size="22" fill="#285fbc" text-anchor="middle" font-weight="700">Caffeine</text><text x="150" y="565" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">로컬 상태 조회</text><ellipse cx="85" cy="636" rx="63" ry="12" fill="#f4f8f6" stroke="#157458" stroke-width="1.5"/><path d="M22 636V670C22 687 148 687 148 670V636" fill="#f4f8f6" stroke="#157458" stroke-width="1.5"/><text x="85" y="664" font-size="17" fill="#157458" text-anchor="middle" font-weight="650">RDB 원본</text><path d="M148 654H261V551H251" fill="none" stroke="#157458" stroke-width="1.7" marker-end="url(#fig02-state-mobile-arrow-187554)"/><text x="260" y="615" font-size="15" fill="#157458" text-anchor="end" font-weight="500">주기</text><text x="260" y="636" font-size="15" fill="#157458" text-anchor="end" font-weight="500">재동기화</text><text x="18" y="722" font-size="16" fill="#192e42" text-anchor="start" font-weight="650">알림 누락은 원본 재조회로 보완</text></svg>