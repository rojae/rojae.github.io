<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" role="img" aria-labelledby="title desc"><title id="title">접속 경로와 데이터 복제를 각각 확인합니다</title><desc id="desc">접속 가용성 계층은 MaxScale과 Keepalived로 구성했으며 여기서는 내부 연결을 생략합니다. 애플리케이션에서 이 계층을 거쳐 DB에 접속하는 논리 경로와 Galera의 DB 노드 간 복제 관계를 나눠 보여줍니다. 노드 수와 연결은 설명용이며 실제 배치도가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="235" y="16" width="230" height="48" rx="5" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="350" y="47" font-size="20" style="fill:#192e42" font-weight="700" text-anchor="middle" class="">애플리케이션</text><path d="M350 64L350 115" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="371" y="96" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start" class="">DB 접속</text><rect x="66" y="128" width="568" height="112" rx="5" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="90" y="159" font-size="18" style="fill:#285fbc" font-weight="650" text-anchor="start" class="">접속 가용성 계층</text><text x="350" y="198" font-size="23" style="fill:#285fbc" font-weight="700" text-anchor="middle" class="">MaxScale · Keepalived</text><text x="350" y="225" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="middle" class="">내부 연결 생략</text><rect x="66" y="286" width="568" height="195" rx="5" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="90" y="317" font-size="18" style="fill:#157458" font-weight="650" text-anchor="start" class="">Galera · 노드 간 복제</text><path d="M350 240V339H187V367" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M105 392 C105 378 269 378 269 392V439C269 453 105 453 105 439Z" fill="#fff" stroke="#157458" stroke-width="1.5"/><ellipse cx="187.0" cy="392" rx="82.0" ry="10" fill="#eff8f3" stroke="#157458" stroke-width="1.5"/><path d="M431 392 C431 378 595 378 595 392V439C595 453 431 453 431 439Z" fill="#fff" stroke="#157458" stroke-width="1.5"/><ellipse cx="513.0" cy="392" rx="82.0" ry="10" fill="#eff8f3" stroke="#157458" stroke-width="1.5"/><text x="187" y="428" font-size="20" style="fill:#157458" font-weight="700" text-anchor="middle" class="">DB 노드</text><text x="513" y="428" font-size="20" style="fill:#157458" font-weight="700" text-anchor="middle" class="">DB 노드</text><path d="M285 412H414m-7 -5 7 5-7 5M414 429H285m7 -5-7 5 7 5" fill="none" stroke="#157458" stroke-width="1.7"/><text x="350" y="392" font-size="17" style="fill:#157458" font-weight="600" text-anchor="middle" class="">복제</text></svg>