<svg xmlns="http://www.w3.org/2000/svg" width="320" height="548" viewBox="0 0 320 548" role="img" aria-labelledby="title desc"><title id="title">B가 실패한 뒤에도 인증과 A의 커밋은 유지됩니다</title><desc id="desc">설명용 시간축. 인증을 먼저 커밋하고 AFTER_COMMIT 이후 동의 A와 B를 각각 REQUIRES_NEW로 처리합니다. A 성공, B 실패의 예에서 앞선 커밋은 유지됩니다. A와 B의 순서와 시간 간격은 예시입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><path d="M36 48L36 469" fill="none" stroke="#cdd8e3" stroke-width="2"/><circle cx="36" cy="58" r="6" fill="#157458"/><text x="58" y="65" font-size="23" style="fill:#192e42" font-weight="750" text-anchor="start" class="">인증</text><text x="58" y="92" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start" class="">먼저 커밋</text><rect x="58" y="105" width="236" height="43" rx="5" fill="#e4f2eb" stroke="none" stroke-width="1.5"/><text x="74" y="133" font-size="19" style="fill:#157458" font-weight="650" text-anchor="start" class="">인증 트랜잭션</text><text x="74" y="175" font-size="18" style="fill:#157458" font-weight="650" text-anchor="start" class="">✓ 커밋 완료</text><circle cx="36" cy="229" r="6" fill="#157458"/><text x="58" y="236" font-size="23" style="fill:#192e42" font-weight="750" text-anchor="start" class="">동의 A</text><text x="58" y="263" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start" class="mono">REQUIRES_NEW</text><rect x="58" y="276" width="236" height="43" rx="5" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="74" y="304" font-size="19" style="fill:#285fbc" font-weight="650" text-anchor="start" class="">동의 A 처리</text><text x="74" y="346" font-size="18" style="fill:#157458" font-weight="650" text-anchor="start" class="">✓ 커밋 완료</text><circle cx="36" cy="398" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m33 395 6 6 m0 -6 -6 6" stroke="#b33c42" stroke-width="1.7"/><text x="58" y="405" font-size="23" style="fill:#192e42" font-weight="750" text-anchor="start" class="">동의 B</text><text x="58" y="432" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start" class="mono">REQUIRES_NEW</text><rect x="58" y="445" width="236" height="43" rx="5" fill="#fbeef0" stroke="none" stroke-width="1.5"/><text x="74" y="473" font-size="19" style="fill:#b33c42" font-weight="650" text-anchor="start" class="">동의 B 처리</text><text x="74" y="515" font-size="18" style="fill:#b33c42" font-weight="650" text-anchor="start" class="">× 실패</text><path d="M24 201L296 201" fill="none" stroke="#285fbc" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="47" y="185" width="219" height="30" rx="5" fill="#fff" stroke="none" stroke-width="1.5"/><text x="58" y="206" font-size="17" style="fill:#285fbc" font-weight="600" text-anchor="start" class="mono">AFTER_COMMIT</text></svg>