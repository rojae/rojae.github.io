<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="title desc"><title id="title">B가 실패한 뒤에도 인증과 A의 커밋은 유지됩니다</title><desc id="desc">설명용 시간축. 인증을 먼저 커밋하고 AFTER_COMMIT 이후 동의 A와 B를 각각 REQUIRES_NEW로 처리합니다. A 성공, B 실패의 예에서 앞선 커밋은 유지됩니다. A와 B의 순서와 시간 간격은 예시입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="134" y="35" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start" class="">설명용 논리 시간</text><path d="M134 48L665 48" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="662" y="35" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="end" class="">순서·간격은 예시</text><path d="M276 81L276 353" fill="none" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="208" y="72" width="136" height="28" rx="5" fill="#fff" stroke="none" stroke-width="1.5"/><text x="276" y="92" font-size="16" style="fill:#285fbc" font-weight="600" text-anchor="middle" class="mono">AFTER_COMMIT</text><text x="26" y="144" font-size="21" style="fill:#192e42" font-weight="750" text-anchor="start" class="">인증</text><text x="26" y="168" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start" class="">먼저 커밋</text><path d="M134 139L665 139" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="26" y="241" font-size="21" style="fill:#192e42" font-weight="750" text-anchor="start" class="">동의 A</text><text x="26" y="265" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start" class="">독립 TX</text><path d="M134 236L665 236" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="26" y="338" font-size="21" style="fill:#192e42" font-weight="750" text-anchor="start" class="">동의 B</text><text x="26" y="362" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start" class="">독립 TX</text><path d="M134 333L665 333" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><rect x="134" y="120" width="112" height="38" rx="5" fill="#e4f2eb" stroke="#157458" stroke-width="1.5"/><text x="190" y="145" font-size="18" style="fill:#157458" font-weight="650" text-anchor="middle" class="">인증 처리</text><path d="M246 139L657 139" fill="none" stroke="#157458" stroke-width="2"/><circle cx="246" cy="139" r="6" fill="#157458"/><text x="246" y="180" font-size="17" style="fill:#157458" font-weight="650" text-anchor="middle" class="">커밋</text><rect x="579" y="123" width="91" height="32" rx="5" fill="#fff" stroke="none" stroke-width="1.5"/><text x="624" y="145" font-size="17" style="fill:#157458" font-weight="700" text-anchor="middle" class="">결과 유지</text><text x="308" y="201" font-size="16" style="fill:#285fbc" font-weight="500" text-anchor="start" class="mono">REQUIRES_NEW</text><rect x="308" y="217" width="130" height="38" rx="5" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="373" y="242" font-size="18" style="fill:#285fbc" font-weight="650" text-anchor="middle" class="">동의 A 처리</text><path d="M438 236L657 236" fill="none" stroke="#157458" stroke-width="2"/><circle cx="438" cy="236" r="6" fill="#157458"/><text x="438" y="278" font-size="17" style="fill:#157458" font-weight="650" text-anchor="middle" class="">커밋</text><rect x="579" y="220" width="91" height="32" rx="5" fill="#fff" stroke="none" stroke-width="1.5"/><text x="624" y="242" font-size="17" style="fill:#157458" font-weight="700" text-anchor="middle" class="">결과 유지</text><text x="483" y="298" font-size="16" style="fill:#285fbc" font-weight="500" text-anchor="start" class="mono">REQUIRES_NEW</text><rect x="483" y="314" width="130" height="38" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="548" y="339" font-size="18" style="fill:#b33c42" font-weight="650" text-anchor="middle" class="">동의 B 처리</text><circle cx="613" cy="333" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m610 330 6 6 m0 -6 -6 6" stroke="#b33c42" stroke-width="1.7"/><text x="646" y="376" font-size="17" style="fill:#b33c42" font-weight="700" text-anchor="middle" class="">실패</text><path d="M26 398L674 398" fill="none" stroke="#cdd8e3" stroke-width="1.5"/></svg>