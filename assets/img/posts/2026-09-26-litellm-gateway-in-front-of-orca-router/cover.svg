<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Orca Router 앞에 LiteLLM 한 겹 끼우기</title><desc id="desc">LLM 통신 스택 2편 커버. 앱에서 LiteLLM을 거쳐 Orca Router로 가는 경로. 키와 비용은 게이트웨이로 옮겨지고 429는 남았다. 본문 관찰 값: max_budget $0.00005를 넘긴 키는 422 budget_exceeded, 429 뒤 glm-flash-free 폴백도 429.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="0" y="0" width="12" height="630" fill="#285fbc"/>
<text x="72" y="92" font-size="30" font-weight="650" style="fill:#285fbc">LLM 통신 스택 · 2편</text>
<text x="72" y="178" font-size="68" font-weight="800">Orca Router 앞에</text>
<text x="72" y="260" font-size="68" font-weight="800">LiteLLM 한 겹 끼우기</text>
<text x="72" y="326" font-size="32" font-weight="500" style="fill:#52677c">키·비용은 게이트웨이로 옮겨지고, 429는 남았습니다</text>
<rect x="72" y="370" width="1056" height="200" rx="12" fill="#f6f9fd" stroke="#cdd8e3" stroke-width="2"/>
<text x="104" y="424" font-size="30" font-weight="500" class="mono">app → LiteLLM :4000 → Orca Router</text>
<text x="104" y="480" font-size="30" font-weight="500" class="mono">max_budget $0.00005 → <tspan style="fill:#b33c42" font-weight="700">422 budget_exceeded</tspan></text>
<text x="104" y="536" font-size="30" font-weight="500" class="mono">429 → fallback(glm-flash-free)도 <tspan style="fill:#b33c42" font-weight="700">429</tspan></text>
</svg>
