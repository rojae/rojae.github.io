<svg xmlns="http://www.w3.org/2000/svg" width="700" height="640" viewBox="0 0 700 640" role="img" aria-labelledby="title desc"><title id="title">에러가 만들어진 자리 넷: 게이트웨이 둘, 업스트림 둘</title><desc id="desc">앱에서 LiteLLM 게이트웨이의 가상 키 검사와 라우터·쿨다운을 거쳐 업스트림 Orca Router로 가는 요청 경로. 422 budget_exceeded는 가상 키 검사에서, 429 all_deployments_in_cooldown은 라우터에서 게이트웨이가 만들며 업스트림을 부르지 않습니다. 404 invalid_request_error는 api_base에 /v1이 빠져 Orca Router 웹사이트에 닿아서, 429(예외 클래스 RateLimitError)는 Orca Router의 무료 한도에서 업스트림이 만듭니다. 한도는 같은 키의 무료 모델이 공유한 것으로 보입니다(1회 관찰). 앱이 받는 에러 응답은 모두 LiteLLM이 감싸서 돌려줍니다. 응답 시간은 측정하지 않았습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#b33c42" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="375" y="14" width="193" height="520" rx="8" fill="#f6f9fd" stroke="#cdd8e3" stroke-width="1.5"/><rect x="578" y="14" width="108" height="520" rx="8" fill="#fbf7f2" stroke="#cdd8e3" stroke-width="1.5"/><text x="471" y="38" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="middle">LiteLLM 게이트웨이</text><text x="632" y="38" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="middle">업스트림</text><text x="24" y="38" font-size="16" style="fill:#52677c" font-weight="600" text-anchor="start">에러 · 만든 곳</text><rect x="305" y="52" width="60" height="54" rx="5" fill="#fff" stroke="#192e42" stroke-width="1.5"/><text x="335" y="85" font-size="18" style="fill:#192e42" font-weight="700" text-anchor="middle">앱</text><rect x="387" y="52" width="76" height="54" rx="5" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="425" y="74" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="middle">가상 키</text><text x="425" y="96" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="middle">검사</text><rect x="482" y="52" width="76" height="54" rx="5" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="520" y="74" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="middle">라우터</text><text x="520" y="96" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="middle">쿨다운</text><rect x="588" y="52" width="88" height="54" rx="5" fill="#fff" stroke="#96501c" stroke-width="1.5"/><text x="632" y="74" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="middle">Orca</text><text x="632" y="96" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="middle">Router</text><path d="M335 106L335 526" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><path d="M425 106L425 526" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><path d="M520 106L520 526" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><path d="M632 106L632 526" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="24" y="152" font-size="21" style="fill:#b33c42" font-weight="750" text-anchor="start">422</text><text x="70" y="151" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">게이트웨이에서 생김</text><text x="24" y="178" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">budget_exceeded</text><text x="24" y="203" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">예산 넘긴 키 · 요청 전 검사</text><path d="M335 158L393 158" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M395 184L339 184" fill="none" stroke="#b33c42" stroke-width="2" marker-end="url(#arrow-fail)"/><circle cx="335" cy="158" r="4" fill="#285fbc"/><rect x="397" y="150" width="56" height="42" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="425" y="177" font-size="16" style="fill:#b33c42" font-weight="700" text-anchor="middle">× 422</text><text x="24" y="248" font-size="21" style="fill:#b33c42" font-weight="750" text-anchor="start">429</text><text x="70" y="247" font-size="16" style="fill:#285fbc" font-weight="650" text-anchor="start">게이트웨이에서 생김</text><text x="24" y="274" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">all_deployments_in_cooldown</text><text x="24" y="299" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">직전 실패로 배포가 쿨다운 중</text><path d="M335 254L488 254" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 280L339 280" fill="none" stroke="#b33c42" stroke-width="2" marker-end="url(#arrow-fail)"/><circle cx="335" cy="254" r="4" fill="#285fbc"/><rect x="492" y="246" width="56" height="42" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="520" y="273" font-size="16" style="fill:#b33c42" font-weight="700" text-anchor="middle">× 429</text><text x="24" y="344" font-size="21" style="fill:#b33c42" font-weight="750" text-anchor="start">404</text><text x="70" y="343" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">업스트림에서 생김</text><text x="24" y="370" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">invalid_request_error</text><text x="24" y="395" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">/v1 누락 → 웹사이트 404 HTML</text><path d="M335 350L600 350" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 376L339 376" fill="none" stroke="#b33c42" stroke-width="2" marker-end="url(#arrow-fail)"/><circle cx="335" cy="350" r="4" fill="#285fbc"/><rect x="604" y="342" width="56" height="42" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="632" y="369" font-size="16" style="fill:#b33c42" font-weight="700" text-anchor="middle">× 404</text><text x="24" y="440" font-size="21" style="fill:#b33c42" font-weight="750" text-anchor="start">429</text><text x="70" y="439" font-size="16" style="fill:#96501c" font-weight="650" text-anchor="start">업스트림에서 생김</text><text x="24" y="466" font-size="16" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">RateLimitError</text><text x="159.39999999999998" y="466" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">(예외 클래스)</text><text x="24" y="491" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">무료 한도 초과</text><text x="24" y="515" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">같은 키 공유로 보임(1회 관찰)</text><path d="M335 446L600 446" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 472L339 472" fill="none" stroke="#b33c42" stroke-width="2" marker-end="url(#arrow-fail)"/><circle cx="335" cy="446" r="4" fill="#285fbc"/><rect x="604" y="438" width="56" height="42" rx="5" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/><text x="632" y="465" font-size="16" style="fill:#b33c42" font-weight="700" text-anchor="middle">× 429</text><path d="M24 563L60 563" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><text x="68" y="568" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">요청이 간 데까지</text><path d="M232 563L196 563" fill="none" stroke="#b33c42" stroke-width="2" marker-end="url(#arrow-fail)"/><text x="240" y="568" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">그 자리에서 생긴 에러</text><text x="24" y="596" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">앱이 받는 에러 응답은 모두 LiteLLM이 감싸서 돌려줍니다.</text><text x="24" y="622" font-size="16" style="fill:#52677c" font-weight="500" text-anchor="start">선 길이는 요청이 간 거리이며, 응답 시간은 재지 않았습니다.</text></svg>