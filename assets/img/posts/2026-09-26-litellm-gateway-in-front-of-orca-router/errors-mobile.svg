<svg xmlns="http://www.w3.org/2000/svg" width="320" height="962" viewBox="0 0 320 962" role="img" aria-labelledby="title desc"><title id="title">에러가 만들어진 자리 넷: 게이트웨이 둘, 업스트림 둘</title><desc id="desc">앱에서 LiteLLM 게이트웨이의 가상 키 검사와 라우터·쿨다운을 거쳐 업스트림 Orca Router로 가는 요청 경로. 422 budget_exceeded는 가상 키 검사에서, 429 all_deployments_in_cooldown은 라우터에서 게이트웨이가 만들며 업스트림을 부르지 않습니다. 404 invalid_request_error는 api_base에 /v1이 빠져 Orca Router 웹사이트에 닿아서, 429(예외 클래스 RateLimitError)는 Orca Router의 무료 한도에서 업스트림이 만듭니다. 한도는 같은 키의 무료 모델이 공유한 것으로 보입니다(1회 관찰). 앱이 받는 에러 응답은 모두 LiteLLM이 감싸서 돌려줍니다. 응답 시간은 측정하지 않았습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#285fbc" stroke-width="1.4"/></marker><marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#b33c42" stroke-width="1.4"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="34" y="16" width="272" height="42" rx="5" fill="#fff" stroke="#192e42" stroke-width="1.5"/><text x="48" y="44" font-size="19" style="fill:#192e42" font-weight="700" text-anchor="start">앱</text><circle cx="20" cy="37" r="5" fill="#285fbc"/><rect x="32" y="76" width="282" height="359" rx="8" fill="#f6f9fd" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="102" font-size="17" style="fill:#285fbc" font-weight="650" text-anchor="start">LiteLLM · 게이트웨이에서 생김</text><rect x="42" y="116" width="262" height="42" rx="5" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="56" y="144" font-size="19" style="fill:#285fbc" font-weight="700" text-anchor="start">가상 키 검사</text><path d="M60 174L60 248" fill="none" stroke="#b33c42" stroke-width="3"/><text x="74" y="192" font-size="20" style="fill:#b33c42" font-weight="750" text-anchor="start">× 422</text><text x="74" y="217" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">budget_exceeded</text><text x="74" y="242" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">예산 넘긴 키 · 요청 전 검사</text><rect x="42" y="264" width="262" height="42" rx="5" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="56" y="292" font-size="19" style="fill:#285fbc" font-weight="700" text-anchor="start">라우터 · 쿨다운</text><path d="M60 322L60 421" fill="none" stroke="#b33c42" stroke-width="3"/><text x="74" y="340" font-size="20" style="fill:#b33c42" font-weight="750" text-anchor="start">× 429</text><text x="74" y="365" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">all_deployments_</text><text x="74" y="390" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">in_cooldown</text><text x="74" y="415" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">직전 실패로 쿨다운 중</text><rect x="32" y="449" width="282" height="353" rx="8" fill="#fbf7f2" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="475" font-size="17" style="fill:#96501c" font-weight="650" text-anchor="start">업스트림에서 생김</text><rect x="42" y="489" width="262" height="42" rx="5" fill="#fff" stroke="#96501c" stroke-width="1.5"/><text x="56" y="517" font-size="19" style="fill:#96501c" font-weight="700" text-anchor="start">Orca Router</text><path d="M60 547L60 621" fill="none" stroke="#b33c42" stroke-width="3"/><text x="74" y="565" font-size="20" style="fill:#b33c42" font-weight="750" text-anchor="start">× 404</text><text x="74" y="590" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">invalid_request_error</text><text x="74" y="615" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">/v1 누락 → 웹사이트 404</text><path d="M60 639L60 788" fill="none" stroke="#b33c42" stroke-width="3"/><text x="74" y="657" font-size="20" style="fill:#b33c42" font-weight="750" text-anchor="start">× 429</text><text x="74" y="682" font-size="17" style="fill:#192e42" font-weight="500" text-anchor="start" class="mono">RateLimitError</text><text x="74" y="707" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">(예외 클래스)</text><text x="74" y="732" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">무료 한도 초과</text><text x="74" y="757" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">같은 키 공유로 보임</text><text x="74" y="782" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">(1회 관찰)</text><path d="M20 37L20 510" fill="none" stroke="#285fbc" stroke-width="2"/><path d="M20 137L38 137" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M20 285L38 285" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><path d="M20 510L38 510" fill="none" stroke="#285fbc" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="836" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">파란 선: 요청이 지나간 경로</text><text x="20" y="862" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">× 표시: 에러가 생긴 자리</text><text x="20" y="888" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">앱이 받는 에러 응답은 모두</text><text x="20" y="914" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">LiteLLM이 감싸서 돌려줍니다.</text><text x="20" y="940" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">응답 시간은 재지 않았습니다.</text></svg>