<svg xmlns="http://www.w3.org/2000/svg" width="700" height="762" viewBox="0 0 700 762" role="img" aria-labelledby="cases-desktop-title cases-desktop-desc"><title id="cases-desktop-title">신원 확인이 일어나는 곳과 서비스가 받는 사실이 다릅니다</title><desc id="cases-desktop-desc">설명용 순서. 미국 Login.gov는 이메일·비밀번호·추가 인증 수단으로 계정을 만든 뒤, 이용 기관이 요구하면 신분증·개인 정보와 경우에 따라 셀피로 신원을 확인하고 서비스를 이용합니다. 기관이 요구하지 않으면 신원 확인 없이 이용합니다(점선). 스웨덴 BankID는 은행이 발급할 때 여권·국가 신분증으로 본인을 확인하거나 은행 보안기기로 은행의 기존 확인을 이어받고, 발급된 수단을 여러 서비스의 인증·전자서명에 재사용합니다. 싱가포르 Singpass는 Login(계정 접근, 요청 범위에 따라 식별자 포함)과 Myinfo(동의한 정보 제공)가 별도 기능이며, 구성 예로 서비스가 Myinfo를 연동했다면 로그인 뒤 동의한 정보만 받아 신청서 등에 활용합니다. 마름모는 신원을 확인하는 지점, 채운 사각형은 확인된 신원 정보를 서비스가 받는 지점, 테두리만 있는 사각형은 요청 범위에 따라 확인된 식별자를 받을 수 있는 지점입니다.</desc><defs><marker id="cases-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="cases-desktop-arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}</style><rect width="700" height="762" fill="#fff"/><text x="28" y="34" font-size="16" fill="#52677c" text-anchor="start" font-weight="600">먼저</text><text x="672" y="34" font-size="16" fill="#52677c" text-anchor="end" font-weight="600">나중</text><path d="M76 29H624" fill="none" stroke="#285fbc" stroke-width="1.5" marker-end="url(#cases-desktop-arrow-acc)"/><path d="M28 64H672" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="28" y="96" font-size="20" fill="#192e42" text-anchor="start" font-weight="750">미국 Login.gov</text><text x="672" y="96" font-size="16" fill="#52677c" text-anchor="end" font-weight="600">계정을 만든 뒤, 기관이 요구할 때 확인</text><path d="M115 169V134H585V167" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#cases-desktop-arrow)"/><rect x="401.5" y="123" width="132" height="22" fill="#fff"/><text x="467.5" y="140" font-size="16" fill="#52677c" text-anchor="middle" font-weight="600">요구하지 않으면</text><path d="M131 180H334" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><text x="232.5" y="168" font-size="16" fill="#52677c" text-anchor="middle" font-weight="600">이용 기관이 요구하면</text><path d="M366 180H569" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><circle cx="115" cy="180" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="115" y="216" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">계정 생성</text><text x="115" y="240" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">이메일·비밀번호</text><text x="115" y="262" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">추가 인증 수단</text><path d="M350 168L362 180L350 192L338 180Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="350" y="216" font-size="18" fill="#285fbc" text-anchor="middle" font-weight="700">신원 확인</text><text x="350" y="240" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">신분증·개인 정보</text><text x="350" y="262" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">경우에 따라 셀피</text><circle cx="585" cy="180" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="585" y="216" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">기관 서비스 이용</text><path d="M28 282H672" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="28" y="314" font-size="20" fill="#192e42" text-anchor="start" font-weight="750">스웨덴 BankID</text><text x="672" y="314" font-size="16" fill="#52677c" text-anchor="end" font-weight="600">은행이 발급할 때 확인</text><path d="M131 362H334" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><path d="M366 362H569" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><path d="M115 350L127 362L115 374L103 362Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="115" y="398" font-size="18" fill="#285fbc" text-anchor="middle" font-weight="700">신원 확인</text><text x="115" y="422" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">여권·국가 신분증(보안기기는</text><text x="115" y="444" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">은행의 기존 확인을 이어받음)</text><circle cx="350" cy="362" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="350" y="398" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">BankID 발급</text><text x="350" y="422" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">은행이 발급</text><circle cx="585" cy="362" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="585" y="398" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">여러 서비스에서</text><text x="585" y="422" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">인증·전자서명에</text><text x="585" y="444" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">발급된 수단 재사용</text><path d="M28 464H672" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="28" y="496" font-size="20" fill="#192e42" text-anchor="start" font-weight="750">싱가포르 Singpass</text><text x="672" y="496" font-size="16" fill="#52677c" text-anchor="end" font-weight="600">Login과 Myinfo는 별도 기능</text><path d="M131 544H334" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><text x="232.5" y="532" font-size="16" fill="#52677c" text-anchor="middle" font-weight="600">서비스가 연동했다면</text><path d="M366 544H569" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-desktop-arrow)"/><rect x="106" y="535" width="18" height="18" fill="#fff" stroke="#192e42" stroke-width="2.2"/><text x="115" y="580" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">Login</text><text x="115" y="604" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">계정 접근(요청 범위에</text><text x="115" y="626" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">따라 식별자 포함)</text><rect x="341" y="535" width="18" height="18" fill="#192e42" stroke="#192e42" stroke-width="2"/><text x="350" y="580" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">Myinfo 동의</text><text x="350" y="604" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">동의한 정보만</text><text x="350" y="626" font-size="16" fill="#52677c" text-anchor="middle" font-weight="500">서비스에 제공</text><circle cx="585" cy="544" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="585" y="580" font-size="18" fill="#192e42" text-anchor="middle" font-weight="700">신청서 등에 활용</text><path d="M28 646H672" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><path d="M40 665L49 674L40 683L31 674Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="58" y="680" font-size="16" fill="#192e42" text-anchor="start" font-weight="600">신원을 확인하는 지점</text><rect x="265" y="667" width="14" height="14" fill="#192e42" stroke="#192e42" stroke-width="2"/><text x="290" y="680" font-size="16" fill="#192e42" text-anchor="start" font-weight="600">확인된 신원 정보를 서비스가 받는 지점</text><rect x="33" y="697" width="14" height="14" fill="#fff" stroke="#192e42" stroke-width="2.2"/><text x="58" y="710" font-size="16" fill="#192e42" text-anchor="start" font-weight="600">요청 범위에 따라 확인된 식별자를 받을 수 있는 지점</text><circle cx="40" cy="734" r="7" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="58" y="740" font-size="16" fill="#192e42" text-anchor="start" font-weight="600">그 밖의 단계</text><path d="M258 734H290" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="6 5"/><text x="300" y="740" font-size="16" fill="#192e42" text-anchor="start" font-weight="600">기관이 요구하지 않을 때의 경로</text></svg>