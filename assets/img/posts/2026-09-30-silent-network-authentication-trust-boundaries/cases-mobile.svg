<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1503" viewBox="0 0 320 1503" role="img" aria-labelledby="cases-mobile-title cases-mobile-desc"><title id="cases-mobile-title">신원 확인이 일어나는 곳과 서비스가 받는 사실이 다릅니다</title><desc id="cases-mobile-desc">설명용 순서. 미국 Login.gov는 이메일·비밀번호·추가 인증 수단으로 계정을 만든 뒤, 이용 기관이 요구하면 신분증·개인 정보와 경우에 따라 셀피로 신원을 확인하고 서비스를 이용합니다. 기관이 요구하지 않으면 신원 확인 없이 이용합니다(점선). 스웨덴 BankID는 은행이 발급할 때 여권·국가 신분증으로 본인을 확인하거나 은행 보안기기로 은행의 기존 확인을 이어받고, 발급된 수단을 여러 서비스의 인증·전자서명에 재사용합니다. 싱가포르 Singpass는 Login(계정 접근, 요청 범위에 따라 식별자 포함)과 Myinfo(동의한 정보 제공)가 별도 기능이며, 구성 예로 서비스가 Myinfo를 연동했다면 로그인 뒤 동의한 정보만 받아 신청서 등에 활용합니다. 마름모는 신원을 확인하는 지점, 채운 사각형은 확인된 신원 정보를 서비스가 받는 지점, 테두리만 있는 사각형은 요청 범위에 따라 확인된 식별자를 받을 수 있는 지점입니다.</desc><defs><marker id="cases-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="cases-mobile-arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker></defs><style>text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.35px}</style><rect width="320" height="1503" fill="#fff"/><text x="20" y="30" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">먼저 → 나중</text><text x="20" y="54" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">위에서 아래로 진행</text><path d="M20 76H300" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="20" y="110" font-size="21" fill="#192e42" text-anchor="start" font-weight="750">미국 Login.gov</text><text x="20" y="138" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">계정을 만든 뒤,</text><text x="20" y="162" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">기관이 요구할 때 확인</text><circle cx="34" cy="204" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="60" y="211" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">계정 생성</text><text x="60" y="237" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">이메일·비밀번호</text><text x="60" y="261" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">추가 인증 수단</text><path d="M34 220V309" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><text x="60" y="301" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">이용 기관이 요구하면</text><path d="M34 315L46 327L34 339L22 327Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="60" y="334" font-size="19" fill="#285fbc" text-anchor="start" font-weight="700">신원 확인</text><text x="60" y="360" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">신분증·개인 정보</text><text x="60" y="384" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">경우에 따라 셀피</text><path d="M34 343V408" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><circle cx="34" cy="426" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="60" y="433" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">기관 서비스 이용</text><path d="M24 204H12V426H21" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#cases-mobile-arrow)"/><text x="60" y="459" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">점선: 요구하지 않으면</text><path d="M20 499H300" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="20" y="533" font-size="21" fill="#192e42" text-anchor="start" font-weight="750">스웨덴 BankID</text><text x="20" y="561" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">은행이 발급할 때 확인</text><path d="M34 591L46 603L34 615L22 603Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="60" y="610" font-size="19" fill="#285fbc" text-anchor="start" font-weight="700">신원 확인</text><text x="60" y="636" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">여권·국가 신분증</text><text x="60" y="660" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">(보안기기는 은행의</text><text x="60" y="684" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">기존 확인을 이어받음)</text><path d="M34 619V708" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><circle cx="34" cy="726" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="60" y="733" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">BankID 발급</text><text x="60" y="759" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">은행이 발급</text><path d="M34 742V783" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><circle cx="34" cy="801" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="60" y="808" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">여러 서비스에서</text><text x="60" y="834" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">인증·전자서명에</text><text x="60" y="858" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">발급된 수단 재사용</text><path d="M20 896H300" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><text x="20" y="930" font-size="21" fill="#192e42" text-anchor="start" font-weight="750">싱가포르 Singpass</text><text x="20" y="958" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">Login과 Myinfo는 별도 기능</text><rect x="25" y="991" width="18" height="18" fill="#fff" stroke="#192e42" stroke-width="2.2"/><text x="60" y="1007" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">Login</text><text x="60" y="1033" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">계정 접근(요청 범위에</text><text x="60" y="1057" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">따라 식별자 포함)</text><path d="M34 1016V1105" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><text x="60" y="1097" font-size="17" fill="#52677c" text-anchor="start" font-weight="600">서비스가 연동했다면</text><rect x="25" y="1114" width="18" height="18" fill="#192e42" stroke="#192e42" stroke-width="2"/><text x="60" y="1130" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">Myinfo 동의</text><text x="60" y="1156" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">동의한 정보만</text><text x="60" y="1180" font-size="17" fill="#52677c" text-anchor="start" font-weight="500">서비스에 제공</text><path d="M34 1139V1204" fill="none" stroke="#52677c" stroke-width="1.7" marker-end="url(#cases-mobile-arrow)"/><circle cx="34" cy="1222" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="60" y="1229" font-size="19" fill="#192e42" text-anchor="start" font-weight="700">신청서 등에 활용</text><path d="M20 1259H300" fill="none" stroke="#cdd8e3" stroke-width="1.5"/><path d="M32 1280L41 1289L32 1298L23 1289Z" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><text x="50" y="1295" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">신원을 확인하는 지점</text><rect x="25" y="1318" width="14" height="14" fill="#192e42" stroke="#192e42" stroke-width="2"/><text x="50" y="1331" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">확인된 신원 정보를</text><text x="50" y="1355" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">서비스가 받는 지점</text><rect x="25" y="1378" width="14" height="14" fill="#fff" stroke="#192e42" stroke-width="2.2"/><text x="50" y="1391" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">요청 범위에 따라 확인된</text><text x="50" y="1415" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">식별자를 받을 수 있는 지점</text><circle cx="32" cy="1445" r="7" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="50" y="1451" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">그 밖의 단계</text><path d="M20 1475H44" fill="none" stroke="#52677c" stroke-width="1.7" stroke-dasharray="6 5"/><text x="50" y="1481" font-size="17" fill="#192e42" text-anchor="start" font-weight="600">요구하지 않을 때의 경로</text></svg>